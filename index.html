        ['th-05', 66, 'Une seconde balle de service touche la bande et tombe bonne. Le serveur a-t-il droit à une ou à 2 balles ?',
          ['2 balles : le let annule la première faute de service', '2 balles, si l’arbitre estime que le serveur a été gêné', 'Aucune : une balle let en seconde balle est une double faute', 'Une seule : la première faute n’est pas annulée'], 3,
          'Une seule : la première faute n’est pas annulée.'],
        ['th-05', 67, 'Dans lequel de ces cas un let doit-il être annoncé en cours de jeu ?',
          ['Un spectateur applaudit bruyamment pendant l’échange, sans gêner personne', 'Un ramasseur attrape au vol une balle qui pouvait tomber dans le court', 'Un joueur fait un doublé involontaire en renvoyant la balle de l’autre côté', 'Un joueur casse une corde de sa raquette en cours d’échange et continue'], 1,
          '– Lorsque le serveur lance, pour la première fois, involontairement 2 balles en l’air au service. Les fois suivantes, ce sera considéré comme une gêne volontaire et il perdra le point.\n– Si un joueur gêne involontairement son adversaire. La première fois, un let est annoncé mais l’arbitre prévient le joueur que s’il gêne à nouveau son adversaire, il perdra le point.\n– Si un joueur est gêné par un ramasseur qui n’est manifestement pas à sa place.\n– Si un ramasseur ou un arbitre attrape une balle au vol, sauf si l’arbitre estime que celle-ci n’avait aucune chance de pouvoir tomber dans les limites du court.\n– Si, une balle en jeu ayant heurté une balle restée au sol, un joueur renvoie l’une des 2 et si l’arbitre n’est pas sûr que ce soit la bonne.\n– Si un joueur a été gêné par l’apparition, en cours d’échange, d’un élément perturbateur ne dépendant pas de sa volonté (exemple : balle qui arrive d’un autre court).\n– Si une balle est par erreur annoncée faute, et si l’arbitre rectifie alors que le joueur aurait pu jouer la balle.'],
        ['th-05', 68, 'Un let est annoncé au cours d’un échange qui a suivi une seconde balle de service. Le serveur a-t-il alors droit à un premier ou à un second service ?',
          ['Un second service', 'Au choix du serveur', 'Un premier service', 'Au choix du relanceur'], 2,
          'Un premier service.'],
        ['th-05', 69, 'Un spectateur hurle « faute » en cours d’échange. Décision ?',
          ['Let dans tous les cas, l’annonce d’un spectateur étant une gêne extérieure', 'Le joueur qui a frappé la balle annoncée « faute » perd le point', 'L’arbitre fait sortir le spectateur et donne le point au joueur qui allait jouer', 'En général pas de let, sauf si les 2 joueurs ont été gênés et qu’aucun n’est lésé'], 3,
          'En règle générale, il n’y a pas lieu d’annoncer un let. Si toutefois l’arbitre estime que les 2 joueurs ont été gênés, que cette gêne a eu une influence sur le déroulement de l’échange et qu’aucun joueur ne peut être lésé par cette annonce, il peut prononcer un let.'],
        ['th-05', 70, 'Un spectateur crie alors qu’un joueur se prépare à smasher. L’arbitre ne dit rien, le joueur rate son smash, puis réclame un let. Décision ?',
          ['Let : le joueur a été manifestement gêné par le cri du spectateur', 'Le joueur gagne le point, la gêne extérieure l’ayant fait rater son smash', 'Le point est rejoué avec un premier service, la gêne étant extérieure', 'Le point n’a pas à être rejoué : il a essayé de le gagner malgré la gêne'], 3,
          'Le point n’a pas à être rejoué, le joueur ayant essayé de le gagner malgré la gêne.'],
        ['th-05', 71, 'Le serveur fait un ace sur sa seconde balle, l’arbitre annonce le score. Le relanceur fait alors remarquer qu’un juge de ligne a indiqué du bras que la balle était faute et que cela l’a gêné. Le juge de ligne confirme les faits. Décision ?',
          ['Le score déjà annoncé ne peut plus être modifié : l’ace est confirmé dans tous les cas', 'S’il estime que le relanceur ne pouvait pas retourner, il confirme le score ; sinon il fait rejouer le point', 'Il fait rejouer le point dans tous les cas, le juge de ligne ayant reconnu son geste', 'Il donne le point au relanceur, l’erreur du juge de ligne l’ayant privé de sa chance'], 1,
          '– Si l’arbitre estime que le relanceur n’aurait de toute façon pas pu retourner, il confirme le score.\n– S’il estime que le relanceur a pu effectivement être gêné, il fait rejouer le point.'],
        ['th-05', 72, 'À la fin d’un échange, un joueur ramasse la balle qui vient d’être utilisée et constate qu’elle est crevée. Décision ?',
          ['On rejoue le point (let) et on retire la balle crevée', 'Le point joué reste acquis et on retire la balle crevée', 'Le point est rejoué seulement si le perdant le demande', 'Le joueur qui a perdu l’échange gagne le point'], 0,
          'Dans tous les cas, on rejoue le point (let) ; on retire la balle crevée du jeu qu’on remplacera au changement de côté suivant, sauf s’il ne reste que deux balles.'],
        ['th-05', 73, 'Un doublé involontaire dans la raquette doit-il être considéré comme une gêne entraînant un let ?',
          ['Oui, un let est annoncé', 'Non, le jeu se poursuit', 'Non, mais le joueur perd le point', 'Oui, si l’adversaire le réclame'], 1,
          'Non, le jeu se poursuit.'],
        ['th-05', 74, 'Un joueur A fait un doublé involontaire dans sa raquette. Son adversaire B ne joue pas la balle, croyant à la faute. Décision ?',
          ['Let, le point est rejoué', 'A perd le point pour doublé', 'B perd le point', 'Premier service à rejouer'], 2,
          'B perd le point.'],
        ['th-05', 75, 'Un joueur se penchant par-dessus le filet pour jouer une balle « rétro » est gêné dans l’exécution de son coup par son adversaire A. Décision ?',
          ['A perd le point dans tous les cas, la gêne ayant eu lieu au filet', 'Let dans tous les cas, que la gêne soit volontaire ou non', 'Gêne involontaire : let ; gêne volontaire : A perd le point', 'Le joueur gêné perd le point, car il a passé le bras au-dessus du filet'], 2,
          '– Si la gêne est involontaire, un let doit être annoncé.\n– Si la gêne est volontaire, le joueur A perd le point.'],
        ['th-05', 76, 'Un joueur est gêné par une caméra de télévision placée dans l’angle du court avec l’accord du juge-arbitre. Y a-t-il lieu de prononcer un let ?',
          ['Oui, toujours', 'Non', 'Oui, s’il le demande avant le point', 'Oui, mais la première fois seulement'], 1,
          'Non.'],
        ['th-05', 77, 'Un joueur, déporté hors du court, tente un lob, mais sa balle heurte l’arbitre de chaise. Le joueur prétend qu’elle aurait été bonne et réclame un let. Décision ?',
          ['Let, l’arbitre ayant gêné la balle', 'Le joueur gagne le point', 'Let si la balle allait vers le court', 'Le joueur perd le point'], 3,
          'Le joueur perd le point.'],
        ['th-05', 78, 'Un joueur, gêné dans l’exécution de son coup par un juge de ligne correctement assis à sa place, demande un let. Décision ?',
          ['L’arbitre accorde un let', 'Let, la première fois seulement', 'L’arbitre refuse', 'Le joueur gêné gagne le point'], 2,
          'L’arbitre refuse.'],
        ['th-05', 79, 'Le joueur A manque un smash qui part vers les bâches ; son adversaire B, manifestement gêné par un ramasseur qui s’est précipité, est touché par la balle, en dehors du court. Décision ?',
          ['Let, le point est rejoué', 'Point pour A', 'Point pour B', 'Premier service à rejouer'], 2,
          'Point pour B.'],
        ['th-05', 80, 'Un joueur se dit gêné par son adversaire qui pousse des petits cris en frappant la balle. Décision ?',
          ['Les cris sont interdits : le joueur qui crie perd le point dès la première fois', 'Pas de faute a priori ; selon l’arbitre : let si gêne effective, point perdu si c’est volontaire', 'Let dans tous les cas, puis point perdu pour le joueur qui crie les fois suivantes', 'Rien : les cris en frappant la balle ne peuvent jamais être considérés comme une gêne'], 1,
          'Pas de faute a priori, mais la décision est laissée à l’appréciation de l’arbitre, qui, s’il considère qu’il y a eu gêne effective, peut prononcer un let ou donner point perdu au joueur qui a crié s’il estime que cela a été volontaire.'],
        ['th-05', 81, 'Au moment où le serveur commence son geste, le relanceur sautille et bouge : en a-t-il le droit ?',
          ['Oui, si c’est pour mieux rentrer dans l’échange ; non, si c’est pour gêner le serveur', 'Non, le relanceur doit rester immobile jusqu’à la frappe de la balle par le serveur', 'Oui, dans tous les cas : il peut sautiller, bouger et même taper des pieds', 'Non, sauf entre la première et la seconde balle, où il peut se replacer librement'], 0,
          '– Oui, si ses mouvements ont pour seul but de lui permettre de mieux rentrer dans l’échange.\n– Non, s’ils ont pour but de gêner l’adversaire dans l’exécution du service. Par exemple, le relanceur peut sautiller, mais pas taper des pieds.\nLa règle est identique pendant l’échange.'],
        ['th-05', 82, 'En simple, le joueur A court sur une amortie et, emporté par son élan, saute par-dessus le filet pour retomber du côté de B, dans le couloir de double. B fait une faute, puis prétend avoir été gêné. Décision ?',
          ['Point pour B, car A a franchi le filet pendant que la balle était en jeu', 'Point pour A, B ayant de toute façon tenté de gagner le point', 'Let, car B a été gêné par la présence de A de son côté du filet', 'Point pour B, car A a touché le sol du côté de son adversaire'], 1,
          'Point pour A, B ayant de toute façon tenté de gagner le point. Le couloir de double ne fait pas partie du court de simple. A n’a donc pas fait de faute.'],
        ['th-05', 83, 'Un joueur qui avait la possibilité de faire un coup gagnant ne renvoie qu’une balle facile pour son adversaire, et crie alors : « C’est nul ». Son adversaire, surpris, ne joue pas la balle. Décision ?',
          ['Le joueur qui a crié perd le point', 'Let, l’adversaire ayant été surpris', 'L’adversaire perd le point, il n’a pas joué la balle', 'Avertissement au joueur qui a crié, et point rejoué'], 0,
          'Le joueur qui a crié en cours d’échange perd le point. Si toutefois l’arbitre n’est pas intervenu et si l’adversaire a joué la balle et fait une faute alors qu’il aurait pu ne pas la jouer, il ne peut ensuite prétendre à une gêne pour réclamer le point ou un let.'],
        ['th-05', 84, 'Sur dur, au cours d’un échange, le joueur A crie « Faute ! Faute ! » à la suite d’une balle proche annoncée bonne sur la ligne de fond. Décision ?',
          ['Le joueur A perd le point : c’est une gêne volontaire', 'Let, la balle étant proche de la ligne de fond', 'Rien : le point continue, A peut contester une balle', 'A reçoit un avertissement et l’échange est rejoué'], 0,
          'Le joueur A perd le point ; cela constitue une gêne volontaire.'],
        ['th-05', 85, 'Le joueur A réussit un lob gagnant, mais celui-ci heurte un oiseau qui passe au-dessus du court. Son adversaire réclame le point. Décision ?',
          ['Le joueur A gagne le point', 'Le joueur A perd le point', 'Un let est accordé', 'La balle est faute'], 2,
          'Un let est accordé, l’oiseau étant considéré comme un objet en mouvement au-dessus du court.'],
        ['th-06', 86, 'Un joueur peut-il frapper une balle de l’autre côté du filet, c’est-à-dire dans la moitié de court de son adversaire ?',
          ['Oui, toujours', 'Non, sauf pour une balle « rétro »', 'Oui, s’il ne touche pas le filet', 'Non, jamais'], 1,
          'Non, sauf dans le cas d’une balle dite « rétro » (balle qui repart directement de l’autre côté du filet après un rebond de son côté par suite d’un effet ou du vent).'],
        ['th-06', 87, 'Un joueur peut-il, après avoir frappé la balle de son côté du court, terminer son geste en passant le bras ou la raquette de l’autre côté du filet ?',
          ['Non, il perd le point', 'Seulement en double', 'Non, sauf sur un smash', 'Oui'], 3,
          'Oui.'],
        ['th-06', 88, 'Un joueur, emporté par son élan sur une balle très croisée, dépasse le prolongement imaginaire du filet. Est-ce une faute ?',
          ['Oui, il perd le point', 'Non', 'Oui, s’il touche le sol adverse', 'Seulement en double'], 1,
          'Non.'],
        ['th-06', 89, 'À la suite d’un coup très croisé, un joueur frappe une balle qui passe à l’extérieur du poteau, en dessous du niveau du filet, et tombe bonne. Décision ?',
          ['La balle est bonne, l’échange se poursuit', 'La balle est faute, elle est passée hors du filet', 'Let, la trajectoire n’étant pas réglementaire', 'La balle est faute, car elle est passée sous le niveau du filet'], 0,
          'La balle est bonne. L’échange se poursuit.'],
        ['th-06', 90, 'En exécutant un smash gagnant, un joueur touche le filet avec sa raquette. Décision ?',
          ['Il perd le point si sa raquette touche le filet avant que le point soit acquis', 'Il gagne le point dans tous les cas, puisque son smash était gagnant', 'Il perd le point dans tous les cas, dès que sa raquette touche le filet', 'Let, car on ne peut pas savoir si le smash aurait été gagnant'], 0,
          '– Si sa raquette touche le filet avant que le point n’ait été acquis, le joueur perd le point.\n– Si c’est après que le point ait été acquis, il gagne le point (il en va de même si le joueur touche lui-même le filet).'],
        ['th-06', 91, 'En simple, sur un service très croisé, le retour heurte la bande du filet, entre le piquet de simple et le poteau de double, et tombe bon. Décision ?',
          ['La balle est bonne, l’échange continue', 'Let, le point est rejoué', 'Le relanceur perd le point', 'Premier service à rejouer'], 2,
          'Le relanceur perd le point car, en simple, cette partie du filet est une dépendance permanente du court.'],
        ['th-06', 92, 'En simple, un joueur, courant sur une amortie, renvoie la balle (bonne) et se raccroche au filet entre le piquet de simple et le poteau de double. Est-ce une faute ?',
          ['Non, cette partie du filet est une dépendance permanente', 'Oui, il perd le point, car il a touché le filet en jeu', 'Oui, mais seulement s’il touche la bande du filet', 'Non, mais un let est annoncé, l’adversaire ayant pu être gêné'], 0,
          'Non, car en simple, le poteau de double et la partie du filet comprise entre le piquet de simple et le poteau de double sont des dépendances permanentes du court.'],
        ['th-06', 93, 'Emporté par sa course sur une amortie, un joueur passe le pied sous le filet sans le toucher. Est-ce une faute ?',
          ['Non, puisqu’il n’a touché ni le filet ni la balle de l’autre côté du filet', 'Oui, dans tous les cas, y compris en simple quand il passe dans le couloir', 'Oui, si la balle est en jeu (sauf, en simple, sous le filet dans le couloir)', 'Non, sauf en double, où le couloir fait partie du court de l’adversaire'], 2,
          'Oui, si la balle est encore en jeu, car le joueur a mis le pied dans le court du côté de son adversaire. Il n’y a pas de faute si, en simple, le joueur passe son pied dans le couloir sous le filet sans le toucher.'],
        ['th-06', 94, 'En cours de jeu, une balle heurte la bande et tombe de l’autre côté sur le tube métallique qui se trouve au pied du filet. Cette balle est-elle toujours en jeu ?',
          ['Non, la balle est faute, le tube ne faisant pas partie du court', 'Non, un let est annoncé, la trajectoire étant imprévisible', 'Oui, le tube fait alors partie du court (et ce rebond compte)', 'Oui, et l’adversaire peut encore attendre un rebond au sol'], 2,
          'Oui, car dans ce cas le tube métallique est considéré comme faisant partie du court.\nDans ce cas, l’adversaire peut-il attendre encore un rebond avant de jouer la balle ? Non, lorsque la balle rebondit sur le tube métallique cela compte pour un rebond.'],
        ['th-06', 95, 'Un joueur, entraîné dans son élan, pose le pied sur le tube métallique alors que la balle est en jeu. Décision ?',
          ['Aucune faute : le tube fait partie du court du joueur', 'Let, le tube n’étant pas une partie du court', 'Faute seulement si son pied touche aussi le filet', 'Le joueur perd le point : le tube fait alors partie du filet'], 3,
          'Le joueur perd le point car, dans ce cas, le tube métallique est considéré comme faisant partie du filet.'],
        ['th-07', 96, 'Qui doit servir le premier point du jeu décisif ?',
          ['Le joueur qui a servi au cours du jeu précédant le jeu décisif', 'Le joueur qui a gagné le tirage au sort au début de la partie', 'Le joueur qui a relancé au cours du jeu précédant le jeu décisif', 'Le joueur qui a servi le premier jeu de la manche en cours'], 2,
          'Le joueur qui a relancé au cours du jeu précédant le jeu décisif.'],
        ['th-07', 97, 'De quel côté doit être servi le premier point du jeu décisif ?',
          ['À gauche', 'Au choix du serveur', 'Au choix du relanceur', 'À droite'], 3,
          'À droite.'],
        ['th-07', 98, 'Quelle est l’alternance des services au cours d’un jeu décisif ?',
          ['Chaque joueur sert 2 points à tour de rôle, en commençant à droite, dès le premier point', 'Chaque joueur sert un point à tour de rôle, en alternant droite et gauche à chaque point', 'Chaque joueur sert 3 points à tour de rôle, en commençant à droite, puis à gauche', 'Le premier serveur sert un point (à droite), puis chacun sert 2 points (à gauche, puis à droite)'], 3,
          'Le premier serveur sert un point (à droite), puis les joueurs servent 2 points chacun (à gauche, puis à droite).'],
        ['th-07', 99, 'Quand les joueurs changent-ils de côté au cours d’un jeu décisif ?',
          ['Tous les 4 points (et à la fin du jeu décisif)', 'Une seule fois, après les 6 premiers points', 'Tous les 6 points (et à la fin du jeu décisif)', 'Tous les 7 points, puis à la fin du jeu décisif'], 2,
          'Tous les 6 points (et à la fin du jeu décisif).'],
        ['th-07', 100, 'Les joueurs ont-ils droit au repos d’1 minute 30 lorsqu’ils changent de côté au cours d’un jeu décisif ?',
          ['Oui, 1 minute 30, comme à chaque changement de côté', 'Non, il n’y a pas d’interruption de jeu : ni repos ni conseils', 'Oui, 1 minute, la moitié du repos de fin de manche', 'Seulement en rencontre par équipes, pour les conseils du capitaine'], 1,
          'Non, il n’y a pas d’interruption de jeu ; il n’y a donc ni repos ni conseils (en rencontre par équipes).'],
        ['th-07', 101, 'Les joueurs changent de côté à la fin d’un jeu décisif. Ont-ils droit au repos de 2 minutes ?',
          ['Non, le jeu doit être continu après un jeu décisif', 'Non, seulement 1 minute 30, comme à un changement de côté', 'Oui, mais seulement si la manche suivante est la dernière', 'Oui, c’est une pause de fin de manche'], 3,
          'Oui, car il s’agit d’une pause de fin de manche.'],
        ['th-07', 102, 'Quand un jeu décisif est-il gagné ?',
          ['Dès qu’un joueur a marqué 7 points', 'À au moins 7 points, avec 2 points d’écart', 'À au moins 10 points, avec 2 points d’écart', 'À au moins 6 points, avec 2 points d’écart'], 1,
          'Lorsqu’un joueur a marqué 7 points au moins, et 2 points de plus que son adversaire.'],
        ['th-07', 103, 'Sur lequel de ces scores un jeu décisif peut-il être gagné ?',
          ['9-7', '7-6', '6-4', '8-7'], 0,
          '7-0 ; 7-1 ; 7-2 ; 7-3 ; 7-4 ; 7-5 ; 8-6 ; 9-7 ; 10-8 ; etc.'],
        ['th-07', 104, 'Qui doit servir au début d’une manche après un jeu décisif ?',
          ['Le serveur du premier point du jeu décisif', 'Le relanceur du premier point du jeu décisif', 'Le joueur qui a gagné le jeu décisif', 'Le joueur qui a perdu le jeu décisif'], 1,
          'Le relanceur du premier point du jeu décisif.'],
        ['th-08', 105, 'Quand peut-on jouer un super jeu décisif à 10 points ?',
          ['À 6 jeux partout dans n’importe quelle manche, si les 2 joueurs se mettent d’accord avant la manche', 'À la place d’une troisième manche, pour certaines catégories et formats décidés à l’avance par les organisateurs', 'À tout moment de la partie, si les 2 joueurs se mettent d’accord en cours de jeu pour gagner du temps', 'Quand l’arbitre le décide en cas de pluie ou de nuit tombante, pour terminer la partie plus vite'], 1,
          'Le super jeu décisif à 10 points remplace toujours une troisième manche pour certaines catégories et formats de jeu. Ce format doit être décidé à l’avance par les organisateurs.'],
        ['th-08', 106, 'Qui doit servir au début d’un super jeu décisif à 10 points ?',
          ['Le joueur (ou l’équipe) qui a servi au cours du jeu précédent', 'Le joueur (ou l’équipe) qui a relancé au cours du jeu précédent', 'Le gagnant d’un nouveau tirage au sort fait au début du super jeu décisif', 'Le joueur (ou l’équipe) qui a gagné la deuxième manche'], 1,
          '– En simple, le joueur qui a relancé au cours du jeu précédent.\n– En double, l’équipe qui a relancé au cours du jeu précédent. Elle choisit son serveur, comme à chaque début de manche.'],
        ['th-08', 107, 'Quand le super jeu décisif à 10 points est-il gagné ?',
          ['Dès qu’un joueur ou une équipe a marqué 10 points', 'À au moins 10 points, avec 2 points d’écart', 'À au moins 7 points, avec 2 points d’écart', 'À au moins 10 points, ou à 12 points sans écart'], 1,
          'Lorsqu’un joueur ou une équipe a marqué 10 points au moins, et 2 points de plus que son adversaire. Exemples : 10-2 ; 10-5 ; 10-8 ; 11-9 ; 15-13 ; 22-20 ; etc.'],
        ['th-08', 108, 'Comment l’arbitre doit-il annoncer la fin de la partie ?',
          ['« Jeu, set et match Dupond ; 2 manches à 1 ; 6/3 4/6 1/0 »', '« Jeu, set et match Dupond ; 2 manches à 1 ; 6/3 4/6 10/8 »', '« Jeu et match Dupond ; 2 manches à 1 ; 6/3 4/6 7/6 »', '« Match Dupond ; 3 manches jouées ; 6/3 4/6 10/8 »'], 1,
          'Jeu, set et match Dupond ; 2 manches à 1 ; 6/3 4/6 10/8'],
        ['th-09', 109, 'Quel est le temps accordé aux joueurs entre 2 points ?',
          ['20 secondes, décomptées par l’arbitre', '25 secondes, comme sur le circuit pro', '30 secondes, au-delà desquelles il y a sanction', 'Aucun, le jeu doit être continu'], 3,
          'Aucun. Le jeu doit être continu. À l’appréciation de l’arbitre, le joueur pourra être sanctionné dans le cadre du Code fédéral de conduite si le dépassement est jugé volontaire ou dans le cadre de la procédure de dépassement de temps non intentionnel (avertissement, point, point, point, etc.) si le dépassement est jugé involontaire. Le droit systématique aux 20 ou 25 secondes n’existe que dans certaines épreuves internationales.'],
        ['th-09', 110, 'Quel est le temps accordé aux joueurs au changement de côté ?',
          ['2 minutes à chaque changement de côté, y compris au cours d’un jeu décisif', '1 minute 30 à chaque changement de côté, y compris après le premier jeu de la manche', '1 minute 30, sauf après le premier jeu de chaque manche et au cours d’un jeu décisif', '1 minute à chaque changement de côté, et 1 minute 30 à la fin de chaque manche'], 2,
          '1 minute 30, entre la fin du dernier point du jeu et le moment où la balle est servie pour le premier point du jeu suivant. À la fin du premier jeu de chaque manche et au cours d’un jeu décisif, le jeu doit être continu et les joueurs doivent changer de côté sans temps de repos. À la fin de chaque manche, les joueurs ont droit à un repos de 2 minutes.'],
        ['th-09', 111, 'Aucun des 2 adversaires ne respecte la règle de continuité du jeu, la responsabilité des 2 étant engagée. Décision ?',
          ['Les 2 joueurs reçoivent un avertissement', 'C’est le relanceur qui doit être pénalisé', 'C’est le serveur qui doit être pénalisé', 'Personne, puisque les 2 sont responsables'], 2,
          'C’est le serveur qui doit être pénalisé.'],
        ['th-09', 112, 'Un joueur est victime de crampes ou de toute autre perte naturelle de condition physique. A-t-il droit à une interruption de la partie ?',
          ['Oui, 3 minutes de traitement médical', 'Oui, 5 minutes, comme pour un saignement', 'Oui, mais seulement au changement de côté', 'Non, le jeu doit se poursuivre'], 3,
          'Non, le jeu doit se poursuivre. En cas de non-respect de cette règle, il est sanctionné dans le cadre du Code de conduite (avertissement, 1 point, 3 points, disqualification : seulement prononcée par le juge-arbitre).'],
        ['th-09', 113, 'Un joueur est victime d’une blessure accidentelle. A-t-il droit à une interruption de la partie ?',
          ['Oui, 5 minutes dans tous les cas, cumulables avec les pauses', 'Oui, 3 minutes (jusqu’à 5 minutes en cas de saignement)', 'Non, le jeu doit se poursuivre, comme pour des crampes', 'Oui, 10 minutes, puis échauffement s’il le demande'], 1,
          '– Oui, il a droit à 3 minutes d’interruption, éventuellement cumulables avec la minute 30 accordée au changement de côté ou aux 2 minutes si c’est à la fin d’une manche. Le joueur blessé doit immédiatement préciser s’il désire prendre ses 3 minutes pour recevoir des soins ou s’il préfère attendre le changement de côté.\n– En cas de saignement, le traitement médical peut être étendu jusqu’à 5 minutes.'],
        ['th-09', 114, 'De combien d’interventions au maximum un joueur peut-il bénéficier pour une même blessure ?',
          ['Une seule intervention de 3 minutes, à prendre immédiatement après la blessure', 'Deux : un traitement médical de 3 minutes et le temps d’un changement de côté', 'Autant que nécessaire, tant que chaque intervention ne dépasse pas 3 minutes', 'Trois : un traitement médical de 3 minutes et le temps de 2 changements de côté'], 3,
          'Trois :\n• un traitement médical de 3 minutes ;\n• le temps de deux changements de côté.\nNota : Ces 3 interventions peuvent être prises dans n’importe quel ordre et à n’importe quel moment de la partie.'],
        ['th-09', 115, 'Le soigneur, déjà en cours d’intervention sur un autre court, n’arrive qu’au bout de 12 minutes. L’évaluation et le traitement durent au total 4 minutes. Y a-t-il un échauffement ?',
          ['Non, puisque le traitement lui-même n’a duré que 4 minutes au total', 'Non, un échauffement n’est jamais accordé après un arrêt pour blessure', 'Oui, l’interruption dépassant 15 minutes, sauf accord des 2 joueurs pour reprendre', 'Oui, 10 minutes d’échauffement, la partie ayant été interrompue plus de 15 minutes'], 2,
          'Oui, puisque l’interruption est supérieure à 15 minutes, sauf si les 2 joueurs sont d’accord pour reprendre le jeu.'],
        ['th-09', 116, 'Le soigneur est appelé sur le terrain. Après l’évaluation de la blessure, le soigneur demande à l’arbitre que le traitement soit effectué à l’extérieur du court. Décision ?',
          ['L’arbitre refuse : les soins doivent obligatoirement être donnés sur le court', 'L’arbitre descend de sa chaise et accompagne lui-même le joueur et le soigneur', 'Le joueur sort seul avec le soigneur ; l’arbitre décompte le temps depuis sa chaise', 'L’arbitre appelle le juge-arbitre, qui quitte le court avec le soigneur et le joueur'], 3,
          'L’arbitre appelle le juge-arbitre qui quittera le court avec le soigneur et le joueur.\nÀ quel moment débutera l’interruption des 3 minutes, et qui est responsable du contrôle du temps ? Dans le cas où il existe un moyen de communication entre eux, le juge-arbitre indique à l’arbitre de chaise à quel moment il doit déclencher son chronomètre (début des soins). Ensuite, c’est l’arbitre de chaise qui est responsable du décompte du temps et qui en informe le joueur resté sur le court, ainsi que le juge-arbitre. Faute de liaison entre eux, c’est le juge-arbitre qui assurera seul le contrôle du temps des soins.'],
        ['th-09', 117, 'Une entorse de la cheville doit-elle être considérée comme une blessure ou comme une perte naturelle de condition physique ?',
          ['Une perte naturelle de condition physique', 'Cela dépend de l’avis du soigneur', 'Ni l’une ni l’autre', 'Une blessure'], 3,
          'Une blessure.'],
        ['th-09', 118, 'Un joueur blessé, victime de crampes ou de toute autre perte naturelle de condition physique, ne peut reprendre la partie dans les délais ou refuse de reprendre le jeu sur ordre de l’arbitre. De quelle manière doit-il être pénalisé ?',
          ['Par la procédure de dépassement de temps non intentionnel (avertissement, point, point, etc.)', 'Par le Code de conduite, pour dépassement de temps intentionnel (par périodes de 30 secondes)', 'Par une disqualification immédiate, prononcée par l’arbitre de chaise sans avertissement', 'Il n’est pas pénalisé : la blessure ou les crampes justifient son retard à reprendre'], 1,
          'Par l’application du Code de conduite pour dépassement de temps intentionnel (par périodes de 30 secondes).'],
        ['th-09', 119, 'Un joueur casse une corde en cours d’échange. Décision ?',
          ['Let, le point est rejoué', 'L’échange se poursuit', 'Le joueur perd le point', 'Premier service à rejouer'], 1,
          'L’échange se poursuit.'],
        ['th-09', 120, 'Qui peut décider de l’interruption d’une partie ?',
          ['Uniquement les joueurs, d’un commun accord, qui en informent ensuite l’arbitre', 'Uniquement l’arbitre de chaise, seul juge des conditions de jeu sur son court', 'Le juge-arbitre ou, à défaut, l’arbitre (sous réserve de confirmation du juge-arbitre)', 'Le capitaine de l’équipe recevante ou l’organisateur, responsable des installations'], 2,
          'Le juge-arbitre ou, à défaut, l’arbitre (décision soumise alors à confirmation du juge-arbitre et prise dans la mesure du possible à la fin d’une manche ou lorsque le cumul des jeux dans la manche est pair).'],
        ['th-09', 121, 'Une partie est interrompue par la pluie. Lorsqu’elle sera reprise, le score sera-t-il conservé ?',
          ['Oui, mais seulement si la partie reprend le jour même', 'Oui, que la partie reprenne le jour même ou un autre jour', 'Non, la partie reprend à 0-0 si elle reprend un autre jour', 'Non, seule la manche en cours est reprise à 0-0'], 1,
          'Que la partie soit reprise le jour même ou un autre jour, le score sera conservé (tenir compte toutefois des règlements propres aux championnats par équipes).'],
        ['th-09', 122, 'Un joueur sert un premier service dans le filet. À ce moment, la partie est interrompue par une violente averse. À la reprise, le joueur bénéficiera d’un premier ou d’un second service ?',
          ['D’un premier service', 'D’un second service', 'Il perd le point', 'Au choix du relanceur'], 0,
          'D’un premier service, l’interruption de jeu justifiant cette décision.'],
        ['th-09', 123, 'Une partie est interrompue, les joueurs quittent le court. Peuvent-ils au cours de l’interruption recevoir des soins ou des conseils ?',
          ['Non, jamais pendant la partie', 'Oui, uniquement des soins', 'Oui, sans restriction', 'Oui, uniquement des conseils'], 2,
          'Oui, sans restriction.'],
        ['th-09', 124, 'Un joueur, en désaccord avec l’arbitre sur l’interprétation d’un point de règlement, fait appel au juge-arbitre. Le jeu doit-il se poursuivre ou être interrompu ?',
          ['Le jeu continue toujours jusqu’à l’arrivée du juge-arbitre, quel que soit l’objet de l’appel', 'Le jeu est toujours interrompu jusqu’à l’arrivée du juge-arbitre, quel que soit l’objet de l’appel', 'Le jeu continue jusqu’à la fin de la manche, puis le juge-arbitre tranche le désaccord', 'Interrompu si la décision peut influer sur le score ou le point en jeu ; sinon il se poursuit'], 3,
          'Si la décision finale du juge-arbitre doit avoir une influence sur le score ou le point en jeu, la partie doit être interrompue. Dans le cas contraire (ex. : un joueur demandant que soit déplacée la chaise d’un juge de ligne), le jeu doit se poursuivre jusqu’à l’arrivée du juge-arbitre.'],
        ['th-09', 125, 'Un joueur peut-il être autorisé à sortir du court pour aller aux toilettes ?',
          ['Non, jamais, sauf blessure constatée par le soigneur ou le juge-arbitre', 'Oui, une seule fois par partie, et uniquement pendant une pause de fin de manche', 'Oui, 2 fois par partie (échauffement compris), de préférence en fin de manche', 'Oui, autant de fois que nécessaire, avec 3 minutes à chaque sortie'], 2,
          'Oui, le joueur est autorisé à quitter le court pour se rendre aux toilettes 2 fois par partie (échauffement compris), de préférence à la fin d’une manche. Il bénéficie pour cela d’un temps raisonnable. L’arbitre le fait accompagner pour qu’il ne puisse recevoir ni soins ni conseils. Dans la mesure du possible, un joueur susceptible d’être malade en cours de partie doit prévenir avant la partie l’arbitre, qui en informera son adversaire.'],
        ['th-09', 126, 'Un joueur est déjà sorti du court 2 fois pour se rendre aux toilettes, il demande de sortir une troisième fois à l’arbitre. Décision ?',
          ['Il est refusé dans tous les cas : 2 sorties maximum par partie', 'Il peut être autorisé, mais ne dispose que du temps du changement de côté', 'Il est autorisé avec un temps raisonnable, comme pour les 2 premières sorties', 'Il est autorisé, mais reçoit un avertissement du Code de conduite'], 1,
          'Le joueur peut être autorisé à quitter le court, mais il ne bénéficiera que du temps du changement de côté pour le faire.\nQuel type de sanction l’arbitre doit-il appliquer si le joueur n’est pas au service ou à la relance dans les temps ? La procédure de dépassement de temps non intentionnel s’applique (avertissement, point, point, point, etc.) par périodes de 30 secondes.'],
        ['th-09', 127, 'Un joueur demande à l’arbitre d’aller aux toilettes au milieu d’une manche. Décision ?',
          ['Il est autorisé à sortir immédiatement, avec un temps raisonnable', 'Il est refusé, même en cas d’urgence, jusqu’à la fin de la manche', 'Il peut sortir au prochain changement de côté, sans condition', 'Il doit attendre la pause de fin de manche, sauf urgence'], 3,
          'L’arbitre lui répond qu’il doit attendre la pause de fin de manche pour aller aux toilettes. Si le joueur indique à l’arbitre qu’il s’agit d’une urgence, il l’autorisera exceptionnellement à quitter le court, de préférence avant son jeu de service. Il bénéficie pour cela d’un temps raisonnable.'],
        ['th-10', 128, 'En simple, A contre B : A sert, au début d’un jeu, à la place de B. L’erreur est découverte alors que A mène 30-0 et vient de servir une première balle faute. Décision ?',
          ['A continue de servir jusqu’à la fin du jeu', 'B sert : 30-0, « second service »', 'B doit servir : 0-30, « premier service »', 'Le jeu est rejoué à 0-0 avec B au service'], 2,
          'B doit servir : 0-30, « premier service ».'],
        ['th-10', 129, 'En simple, A contre B : A a servi à la place de B et vient de gagner le jeu, lorsque l’erreur est découverte. Décision ?',
          ['A sert à nouveau pour rétablir l’ordre initial', 'Le jeu est rejoué en entier avec B au service', 'L’ordre reste inversé : B sert, A servira ensuite', 'Le jeu est annulé et B sert le jeu suivant'], 2,
          'L’ordre des services reste inversé, B sert, A servira ensuite.'],
        ['th-10', 130, 'Au début d’un jeu, le joueur A sert, par erreur, de la moitié gauche du court et gagne le point. Il vient de servir une première balle faute de la moitié droite du court, lorsque l’erreur est découverte. Décision ?',
          ['Le point gagné est annulé ; A sert à droite un premier service, à 0-0', 'Les points restent acquis ; A sert à gauche un premier service, à 15-0', 'Les points restent acquis ; A sert à droite une seconde balle, à 15-0', 'Les points restent acquis ; A sert à gauche une seconde balle, à 15-0'], 3,
          'Le point précédent et la faute de service restent acquis. A sert à gauche une seconde balle, à 15-0.'],
        ['th-10', 131, 'L’arbitre s’aperçoit, en cours d’échange, que le service a été délivré depuis la mauvaise moitié du court. Que doit-il faire ?',
          ['Arrêter l’échange immédiatement et faire rejouer le point depuis la bonne moitié', 'Arrêter l’échange immédiatement et donner le point au relanceur pour service irrégulier', 'Laisser l’échange se terminer, puis faire rejouer le point depuis la bonne moitié', 'Laisser l’échange se terminer, valider le point et rectifier pour le point suivant'], 3,
          'Laisser l’échange se terminer, valider le point et rectifier l’erreur pour le point suivant.'],
        ['th-10', 132, 'Une manche se termine sur un score pair. À l’issue de la pause de fin de manche, les joueurs doivent-ils changer de côté ?',
          ['Oui, les joueurs changent toujours à la fin d’une manche', 'Oui, mais seulement si les 2 joueurs le demandent', 'Non, les changements de côté se font sur les jeux impairs', 'Non, sauf si la manche s’est terminée par un jeu décisif'], 2,
          'Non, l’alternance des changements de côté s’effectue en fonction du score (jeux impairs).'],
        ['th-10', 133, 'Un joueur se prépare à servir depuis la mauvaise moitié du court. Que doit faire l’arbitre ?',
          ['L’arrêter avant le service ou, à défaut, entre les 2 services pour qu’il change de position', 'Le laisser servir, puis annoncer faute de service pour position irrégulière', 'Le laisser jouer le point, valider le résultat et rectifier au point suivant', 'Annoncer let après le service et faire rejouer le point depuis la bonne moitié'], 0,
          'L’arrêter avant le début du service ou, à défaut, entre les 2 services en le faisant changer de position immédiatement.'],
        ['th-10', 134, 'L’arbitre se rend compte, en cours d’échange, que le service a été effectué par le joueur qui aurait dû relancer. Que doit-il faire ?',
          ['Laisser l’échange se terminer, valider le point et rectifier pour le point suivant', 'Arrêter l’échange immédiatement et faire servir le bon joueur, le point étant rejoué', 'Arrêter l’échange immédiatement et donner le point au joueur qui aurait dû servir', 'Laisser l’échange se terminer, puis faire rejouer tout le jeu avec le bon serveur'], 0,
          'Laisser l’échange se terminer, valider le point et rectifier l’erreur pour le point suivant.'],
        ['th-10', 135, 'C’est au joueur A de servir, mais c’est son partenaire B qui sert par erreur. L’erreur est découverte à 30-0, alors que B vient de servir une première balle faute. Décision ?',
          ['B termine le jeu, l’ordre étant inversé jusqu’à la fin de la manche', 'On rectifie immédiatement : A sert une seconde balle à 30-0', 'On rectifie immédiatement : A sert un premier service à 30-0', 'On reprend le jeu à 0-0, avec A au service'], 1,
          'On rectifie immédiatement, les points joués restent acquis. A sert une seconde balle à 30-0.'],
        ['th-10', 136, 'Un joueur A a servi tout un jeu à la place de son partenaire B. L’erreur est découverte après la fin du jeu. Décision ?',
          ['L’ordre reste inversé : B sert, puis A, jusqu’à la fin de la manche', 'A sert à nouveau le jeu suivant, pour rétablir l’ordre prévu', 'Le jeu est rejoué en entier, cette fois avec B au service', 'Le jeu est annulé et attribué à l’équipe qui relançait'], 0,
          'L’ordre des services reste inversé : B sert à la place de A, A ensuite, etc. jusqu’à la fin de la manche.'],
        ['th-10', 137, 'En double, on découvre au cours d’un jeu que les relanceurs ont interverti leur position. Décision ?',
          ['On rectifie immédiatement, les points joués restant acquis', 'On rejoue les points depuis le début du jeu, positions corrigées', 'On laisse le jeu se terminer, puis on rectifie quand ils relancent à nouveau', 'On rectifie immédiatement, sauf dans un jeu décisif, terminé tel quel'], 2,
          'Qu’il s’agisse d’un jeu ordinaire ou d’un jeu décisif, on laisse le jeu se terminer avec les positions erronées. On rectifiera l’erreur lorsque ces joueurs seront à nouveau en position de relancer.'],
        ['th-10', 138, 'Un jeu décisif est disputé par erreur alors qu’il avait été décidé et annoncé à l’avance que le système de l’avantage (2 jeux d’écart) serait appliqué. Décision ?',
          ['On revient toujours au système de l’avantage, quel que soit le nombre de points joués', 'On annule les points joués et on reprend la manche avec le système de l’avantage', 'On termine toujours le jeu décisif, même si un seul point a été joué', 'Un seul point joué : retour à l’avantage ; dès le 2e point, on finit le jeu décisif'], 3,
          'Si un seul point a été joué dans le jeu décisif, on revient au système de l’avantage, le point joué restant acquis (15-0 ou 0-15). Dès que le deuxième point a été mis en jeu, on va jusqu’au bout du jeu décisif. Si le jeu décisif est terminé, le résultat est entériné.'],
        ['th-10', 139, 'À 6 jeux partout, un jeu ordinaire est commencé alors qu’il avait été décidé et annoncé à l’avance qu’un jeu décisif serait joué. Décision ?',
          ['Un seul point joué : retour au jeu décisif ; sinon avantage jusqu’à 8 partout', 'On revient toujours au jeu décisif, quel que soit le nombre de points joués', 'On joue la manche à l’avantage jusqu’au bout, sans aucun jeu décisif', 'On annule les points joués et on joue le jeu décisif à 0-0'], 0,
          'Si un seul point a été joué, on revient au jeu décisif, le point joué restant acquis (1-0 ou 0-1). Dès que le deuxième point a été mis en jeu, on va jusqu’au bout de ce jeu. Le système de l’avantage (2 jeux d’écart) est maintenu jusqu’au score éventuel de 8 jeux partout, où un jeu décisif sera joué.'],
        ['th-10', 140, 'Au cours d’un jeu décisif, en simple ou en double, un joueur a servi alors que ce n’était pas son tour. Décision ?',
          ['On rectifie toujours immédiatement, en annulant le dernier point joué par erreur', 'Après le premier point ou une séquence de 2 points : l’alternance erronée est maintenue', 'On recommence le jeu décisif à 0-0, avec le bon ordre de service', 'Les points servis par erreur sont annulés et rejoués par le bon serveur'], 1,
          'Si l’erreur est découverte :\n– après le premier point du jeu décisif, ou après qu’un joueur a servi par erreur une séquence de 2 points, l’alternance erronée des séquences de 2 points doit être maintenue jusqu’à la fin du jeu ;\n– après qu’un joueur a servi par erreur un seul point d’une séquence de 2, l’alternance doit être corrigée immédiatement, le point joué restant acquis. Celui qui aurait dû servir ne servira alors qu’un point au lieu de 2.'],
        ['th-10', 141, 'Au cours d’un jeu décisif, l’erreur d’ordre de service est découverte après le premier point ou après une séquence de 2 points servie par erreur : l’alternance erronée est maintenue jusqu’à la fin du jeu. Qui servira au début de la manche suivante ?',
          ['Le joueur ou l’équipe qui a servi le dernier point du jeu décisif', 'Le joueur ou l’équipe qui a gagné le jeu décisif, comme pour un jeu ordinaire', 'Le joueur ou l’équipe qui aurait dû servir si l’erreur n’avait pas été commise', 'Le joueur ou l’équipe qui a effectivement servi le premier point du jeu décisif'], 2,
          'Le joueur ou l’équipe qui aurait dû servir si l’erreur n’avait pas été commise.'],
        ['th-10', 142, 'Les joueurs ont oublié de changer de côté, au cours d’un jeu décisif, après 6 points, et l’erreur est découverte après 8 points. Décision ?',
          ['Ils changent de côté ; le changement suivant aura lieu après 14 points', 'Ils ne changent pas et attendent le changement prévu après 12 points', 'On rejoue les 2 derniers points après avoir changé de côté', 'Ils changent de côté ; le changement suivant aura lieu après 12 points'], 3,
          'Les joueurs doivent alors changer de côté. Le changement de côté suivant sera effectué, normalement, après 12 points.'],
        ['th-10', 143, 'Au cours d’un match pour lequel il a été décidé d’appliquer le point décisif à 40-A lors d’un jeu, une succession d’avantages/égalités est commencée, et l’erreur est découverte à « avantage Joueur A ». Décision ?',
          ['On applique immédiatement la règle : le point suivant est un point décisif, quel que soit le score', 'On joue le point suivant : si A le gagne, jeu ; sinon, le point suivant est un point décisif', 'On annule les points joués depuis 40-40 et on rejoue à égalité un point décisif', 'On continue le jeu avec avantages et égalités jusqu’à la fin, l’erreur ne pouvant plus être corrigée'], 1,
          'On joue le point suivant. Si le joueur A gagne ce point, il y a jeu sinon on joue encore un point qui sera un point décisif.\nÀ égalité. Décision ? On joue un point décisif.\nÀ la fin du jeu. Décision ? Les points joués restent acquis, le score du jeu est entériné.'],
        ['th-10', 144, 'À égalité, le relanceur se place sur la diagonale des avantages. Son adversaire se prépare à servir et, alors qu’il s’apprête à commencer son geste, le relanceur lève le bras et dit qu’il change d’avis, qu’il souhaite relancer sur la diagonale des égalités. En a-t-il le droit ?',
          ['Oui, tant que le serveur n’a pas frappé la balle', 'Oui, à condition que l’arbitre l’y autorise', 'Non, son choix est définitif dès qu’il s’est dirigé vers un côté', 'Oui, si le serveur accepte d’attendre qu’il se replace'], 2,
          'Non, ce changement de décision est trop tardif. Lorsque le joueur a fait son choix en se dirigeant vers un côté ou l’autre, il est définitif et ne peut plus changer sa décision.'],
        ['th-10', 145, 'À égalité, le relanceur se place sur la diagonale des égalités pour recevoir, il joue et perd le point. Surpris par l’annonce « jeu serveur », il prétexte ne pas avoir joué ce point comme un point décisif et reproche à l’arbitre (lorsqu’il y en a un) ou à son adversaire de ne pas lui avoir signalé le point décisif. Le relanceur souhaite rejouer le point. Décision ?',
          ['On rejoue le point (let)', 'Le relanceur gagne le point', 'Le point joué reste acquis', 'Point rejoué, faute d’annonce'], 2,
          'Le point joué reste acquis. Le relanceur a été informé de l’application de la règle du point décisif pour le match (ou le tournoi) et nul n’est censé la rappeler en cours de jeu.'],
        ['th-10', 146, 'Une manche normale est commencée alors qu’il avait été décidé et annoncé à l’avance que la troisième manche serait remplacée par un super jeu décisif à 10 points. Décision ?',
          ['Un seul point joué : on corrige ; sinon, manche en 3 jeux gagnants, super jeu décisif à 2 jeux partout', 'On joue toute la manche normale jusqu’au bout, avec jeu décisif à 6 jeux partout dans tous les cas', 'On corrige immédiatement et on passe au super jeu décisif, quel que soit le nombre de points joués', 'On annule les jeux joués et on dispute le super jeu décisif à 10 points, les points joués étant perdus'], 0,
          '– L’erreur doit immédiatement être corrigée si un seul point a été joué.\n– Si l’erreur est découverte après le début du deuxième point, la manche doit continuer jusqu’à ce qu’un joueur ou une équipe gagne 3 jeux (et donc la manche) ou que le score atteigne 2 jeux partout. Dans ce cas, un super jeu décisif à 10 points est disputé.\n– Par contre, si l’erreur est découverte après le début du deuxième point du cinquième jeu, la manche continue jusqu’à la fin avec application du jeu décisif classique à 6 jeux partout.'],
        ['th-11', 147, 'Dans quels cas un joueur peut-il faire appel au juge-arbitre ?',
          ['Pour contester une décision sur un fait (balle faute ou bonne, doublé, filet touché), jamais sur le règlement', 'Pour contester une décision sur un point de règlement ou son interprétation, jamais sur un fait', 'Pour toute décision de l’arbitre, qu’elle porte sur un fait ou sur un point de règlement', 'Uniquement pour demander le changement d’un arbitre ou d’un juge de ligne en cours de partie'], 1,
          'Pour toute contestation d’une décision de l’arbitre relative à un point de règlement (règles du jeu ou règlements sportifs) ou à son interprétation. Jamais pour une contestation relative à la matérialité des faits (balle jugée faute ou bonne, doublé, filet touché, etc.).'],
        ['th-11', 148, 'Une première balle de service est annoncée faute, puis corrigée bonne par le juge de médiane. L’arbitre de chaise donne le point au serveur. Le relanceur n’est pas d’accord avec cette décision, disant qu’il aurait pu jouer la balle. L’arbitre de chaise décide alors de faire rejouer le point. Décision ?',
          ['Le point est rejoué, comme l’a finalement décidé l’arbitre de chaise', 'Le point est rejoué avec un second service, la première balle étant bonne', 'Point au serveur : l’arbitre ne change jamais de décision sur contestation d’un joueur', 'Point au relanceur, l’annonce « faute » l’ayant empêché de jouer la balle'], 2,
          'Point au serveur. L’arbitre de chaise ne doit jamais changer de décision sur contestation d’un joueur.'],
        ['th-11', 149, 'Sur terre battue, l’arbitre de chaise procède à une inspection de trace et corrige l’annonce initiale donnant la balle bonne. Il accorde le point au joueur A. Cependant, son adversaire (joueur B) conteste cette décision en disant à l’arbitre de chaise : « Ce n’était pas un coup gagnant, j’ai renvoyé la balle. » L’arbitre de chaise réalise alors que le joueur B avait retourné la balle. Décision ?',
          ['Le point reste acquis à A : l’arbitre ne change jamais de décision', 'Point pour B, qui avait renvoyé la balle avant l’annonce', 'On rejoue le point (l’arbitre n’a pas été influencé par le joueur)', 'L’arbitre doit appeler le juge-arbitre pour trancher la contestation'], 2,
          'On rejoue le point (dans ce cas, l’arbitre n’a pas été influencé par le joueur).'],
        ['th-11', 150, 'Si l’arbitre annonce « faute » une balle manifestement bonne, le juge-arbitre témoin de l’erreur peut-il intervenir ?',
          ['Oui, il peut corriger l’annonce de l’arbitre', 'Non, c’est une question de fait', 'Oui, mais seulement si un joueur le lui demande', 'Oui, mais uniquement sur terre battue, avec la trace'], 1,
          'Non, puisqu’il s’agit d’une question de fait.'],
        ['th-11', 151, 'Un joueur conteste que le premier point du jeu décisif doit être servi à droite, peut-il faire appel au juge-arbitre ?',
          ['Oui, c’est un point de règlement', 'Non, c’est une question de fait', 'Non, la décision de l’arbitre est définitive', 'Oui, mais seulement à la fin du jeu décisif'], 0,
          'Oui, puisqu’il s’agit d’un point de règlement.'],
        ['th-11', 152, 'Un juge de ligne annonce « faute » une balle, mais l’arbitre rectifie et décide que la balle était bonne. Un joueur peut-il, dans ce cas, faire appel au juge-arbitre ?',
          ['Oui, dès qu’il conteste la correction de l’arbitre', 'Oui, si le juge de ligne maintient son annonce initiale', 'Non, l’arbitre est juge en dernier ressort des faits', 'Oui, mais seulement sur terre battue, après inspection de trace'], 2,
          'Non, l’arbitre est juge en dernier ressort de la matérialité des faits, et a le droit de modifier une décision du juge de ligne ou de faire rejouer le point.'],
        ['th-11', 153, 'Le joueur A frappe une balle qui tombe sur la ligne de fond, le juge de ligne annonce « faute », puis s’autocorrige. L’arbitre, qui n’a manifestement pas entendu l’autocorrection, annonce le score (point pour B), confirmant du doigt que la balle était faute. A conteste, indiquant à l’arbitre de chaise que le juge de ligne s’est corrigé, l’arbitre répond : « Je l’ai vue faute. » Le joueur A insiste, faisant réaliser à l’arbitre que le juge de ligne s’était autocorrigé, l’arbitre décide alors de faire rejouer le point. Le juge-arbitre est appelé sur le court. Décision ?',
          ['Le juge-arbitre confirme que le point doit être rejoué, le juge de ligne s’étant autocorrigé', 'Le juge-arbitre donne le point à A, puisque le juge de ligne avait corrigé son annonce en balle bonne', 'Le juge-arbitre va lui-même voir la ligne de fond et décide selon ce qu’il constate de la balle', 'Le juge-arbitre confirme la balle faute : l’arbitre l’avait confirmée avant d’être influencé'], 3,
          'Le juge-arbitre doit confirmer que la balle était faute puisque l’arbitre l’a confirmé avant d’être influencé.'],
        ['th-11', 154, 'Un joueur peut-il exiger le changement d’un arbitre ou d’un juge de ligne ?',
          ['Non, mais le juge-arbitre ou l’arbitre peuvent le faire dans l’intérêt de la partie', 'Oui, une fois par partie, à condition d’en faire la demande pendant un changement de côté', 'Oui, s’il en fait la demande au juge-arbitre en exposant ses raisons', 'Non, et personne ne peut changer un arbitre ou un juge de ligne en cours de partie'], 0,
          'Non. Toutefois, le juge-arbitre ou l’arbitre peuvent prendre l’initiative de le faire dans l’intérêt de la partie.'],
        ['th-11', 155, 'L’arbitre a-t-il le droit de changer la décision d’un juge de ligne ?',
          ['Non, jamais : chaque juge de ligne décide seul sur sa ligne', 'Oui, mais seulement à la demande d’un joueur qui conteste', 'Oui, dès qu’il a un doute sur l’annonce, même léger', 'Oui, en cas d’erreur évidente : c’est un overrule'], 3,
          'Oui, s’il s’agit d’une erreur évidente : c’est un overrule.'],
        ['th-11', 156, 'Sur terre battue, l’arbitre de chaise fait un overrule, le joueur n’est pas d’accord avec l’arbitre et demande que l’arbitre inspecte la trace. L’arbitre a un doute sur l’overrule qu’il vient de faire. Décision ?',
          ['L’arbitre maintient son overrule sans inspecter la trace, puisqu’il ne change pas de décision sur contestation', 'L’arbitre va inspecter lui-même la trace', 'L’arbitre envoie le juge de ligne concerné inspecter la trace et lui annoncer ce qu’il voit', 'L’arbitre fait rejouer le point, puisqu’il a un doute sur son overrule'], 1,
          'L’arbitre va inspecter lui-même la trace.\nQue se passe-t-il si l’arbitre est incapable de montrer une trace ? Confirmation de l’overrule.'],
        ['th-11', 157, 'Que doit faire l’arbitre qui pense qu’un juge de ligne a fait une annonce erronée mais n’en est pas certain ?',
          ['Confirmer l’annonce de son juge de ligne', 'Faire rejouer le point, le doute profitant aux 2 joueurs', 'Corriger l’annonce du juge de ligne par un overrule', 'Demander au juge de ligne s’il est sûr de son annonce, puis décider'], 0,
          'Confirmer l’annonce de son juge de ligne.'],
        ['th-11', 158, 'Le joueur A effectue un lob lifté sur lequel son adversaire B ne court même pas. La balle tombe sur la ligne, mais le juge de ligne l’annonce, par erreur, « faute ». Que doit faire l’arbitre ?',
          ['Overruler immédiatement et faire rejouer le point, l’annonce ayant pu gêner B', 'Confirmer l’annonce du juge de ligne, l’arbitre ne pouvant pas changer sa décision', 'Attendre la contestation de A, puis overruler et lui donner le point', 'Overruler immédiatement et donner le point à A (« Correction, la balle est bonne »)'], 3,
          'Overruler immédiatement le juge de ligne et donner le point à A. L’annonce est : « Correction, la balle est bonne », puis l’annonce du score.'],
        ['th-11', 159, 'Un joueur sert une seconde balle que le juge de ligne annonce « faute » alors qu’elle est sur la ligne. Que doit faire l’arbitre ?',
          ['Point au serveur dans tous les cas, la balle étant sur la ligne et donc bonne', 'Point au serveur si le relanceur n’a pas été gêné et n’avait aucune chance ; sinon point rejoué (premier service)', 'Seconde balle à rejouer, l’annonce erronée ayant pu gêner le relanceur dans sa relance', 'Double faute et point au relanceur, l’annonce du juge de ligne ne pouvant pas être modifiée'], 1,
          '– Si l’arbitre est convaincu que le relanceur n’a pas été gêné par l’annonce et n’avait aucune chance de toucher la balle, il doit donner le point au serveur.\n– Si l’arbitre estime que le relanceur avait la possibilité de relancer la balle, il doit faire rejouer le point (premier service).'],
        ['th-11', 160, 'Un second service qui touche la bande est annoncé « faute », puis corrigé immédiatement par le même juge de ligne. Décision ?',
          ['Second service', 'Premier service', 'Le service est let', 'Double faute'], 0,
          'Second service.'],
        ['th-11', 161, 'Si un arbitre n’entend pas une balle toucher le filet au service ou ne voit pas un trou ou est masqué sur un éventuel doublé, quelle décision doit-il prendre ?',
          ['Le jeu continue ou le point reste acquis ; jamais de let', 'Il annonce un let et fait rejouer le point en entier', 'Il demande aux joueurs ce qu’ils ont vu, puis décide', 'Il fait rejouer le point avec un premier service'], 0,
          'Le jeu continue ou le point reste acquis. En aucun cas un let ne doit être annoncé.'],
        ['th-11', 162, 'Sur dur, un joueur sert un premier service. Le juge de ligne fait immédiatement le signe « balle masquée ». L’arbitre de chaise ne peut pas faire l’annonce. Le relanceur n’a pas joué la balle, disant que celle-ci était faute. Décision ?',
          ['Point au relanceur, qui a jugé la balle faute', 'Point au serveur, personne n’ayant annoncé faute', 'Le point est à rejouer', 'Seconde balle, la première étant comptée faute'], 2,
          'Ni le juge de ligne ni l’arbitre de chaise n’ayant la possibilité de faire d’annonce, le point est à rejouer.'],
        ['th-11', 163, 'L’arbitre peut-il changer la décision d’un juge de ligne à la suite d’une contestation d’un joueur ?',
          ['Non, sauf sur terre battue à l’issue d’une inspection de trace', 'Oui, toujours, si la contestation lui paraît fondée', 'Non, jamais, même sur terre battue après inspection de trace', 'Oui, si le joueur insiste et que le juge de ligne hésite'], 0,
          'Non, sauf sur terre battue, à l’issue d’une inspection de trace.'],
        ['th-11', 164, 'L’arbitre peut-il, après avoir annoncé le score, revenir sur sa décision s’il a eu, entre-temps, connaissance d’un élément nouveau (joueur gêné par un juge de ligne, balle crevée, etc.) ?',
          ['Non, le score annoncé est définitif', 'Oui', 'Oui, mais avec l’accord du juge-arbitre', 'Oui, mais si les 2 joueurs sont d’accord'], 1,
          'Oui.'],
        ['th-11', 165, 'Un juge de ligne annonce une faute de pied avant que le serveur ait frappé la balle, sur un second service. Le serveur interrompt son geste, ne frappe pas la balle. Décision ?',
          ['Faute de pied sur la seconde balle : double faute, point au relanceur', 'Seconde balle à rejouer, l’annonce ayant gêné le serveur dans son geste', 'Le point est rejoué avec un premier service (l’annonce a gêné le serveur)', 'Faute de pied annoncée à tort : le serveur rejoue sa seconde balle'], 2,
          'Le point doit être rejoué, l’annonce ayant constitué une gêne pour le serveur (premier service).'],
        ['th-11', 166, 'Au cours d’un échange, le joueur A fait une faute qui n’est pas annoncée et l’échange se poursuit. A gagne le point. Que doit faire l’arbitre, conscient qu’une erreur a été commise en cours d’échange ?',
          ['Donner le point à A', 'Faire rejouer le point, l’erreur ayant été commise en cours d’échange', 'Donner le point à l’adversaire de A, la faute de A étant certaine', 'Appeler le juge-arbitre pour qu’il tranche la question'], 0,
          'Donner le point à A.'],
        ['th-12', 167, 'En double, le serveur peut-il se tenir dans le prolongement du couloir ?',
          ['Non, c’est une faute de pied, comme en simple', 'Oui, sans limite, jusqu’au bord du court', 'Non, il doit rester entre la marque centrale et la ligne de simple', 'Oui, mais pas au-delà de la ligne de côté de double'], 3,
          'Oui, mais pas au-delà de la ligne de côté de double.'],
        ['th-12', 168, 'Le partenaire du relanceur peut-il se tenir dans le carré de service ?',
          ['Oui, où il veut de son côté du filet, sans gêner l’adversaire', 'Non, il doit se tenir hors du carré de service jusqu’au service', 'Non, il doit se tenir derrière la ligne de fond, comme le relanceur', 'Oui, mais seulement sur un premier service, pas sur le second'], 0,

        ['th-12', 169, 'Le partenaire du relanceur se déplace latéralement d’un carré de service à l’autre au moment où le serveur se prépare et commence son geste. Décision ?',
          ['Let : le service est rejoué et l’arbitre avertit le partenaire du relanceur', 'Si l’arbitre juge ces déplacements destinés à gêner, l’équipe qui relance perd le point', 'Faute du partenaire du relanceur : le serveur bénéficie d’une seconde balle', 'Aucune faute : le partenaire du relanceur peut se déplacer comme il veut'], 1,
          'Le partenaire du relanceur n’est pas autorisé à effectuer de tels déplacements si, dans l’opinion de l’arbitre, ces déplacements étaient destinés à gêner volontairement le serveur. Le point est perdu par l’équipe qui relance.'],
        ['th-12', 170, 'Où doit se tenir le partenaire du serveur ?',
          ['Au filet, devant son carré de service', 'Où il veut de son côté du filet', 'Derrière la ligne de fond, comme le serveur', 'Dans le couloir de double, côté opposé au serveur'], 1,
          'Où il veut de son côté du filet.'],
        ['th-12', 171, 'Une balle de service va heurter directement le partenaire du relanceur sans avoir touché le sol. Décision ?',
          ['Faute de service', 'Let, service rejoué', 'Point pour le relanceur', 'Point pour le serveur'], 3,
          'Point pour le serveur.'],
        ['th-12', 172, 'Une balle de service va directement heurter le partenaire du serveur. Décision ?',
          ['Point pour le serveur', 'Il y a faute de service', 'Let, service rejoué', 'Point pour le relanceur'], 1,
          'Il y a faute de service.'],
        ['th-12', 173, 'Un joueur victime de crampes peut-il être massé par son partenaire ?',
          ['Oui, en respectant la continuité du jeu', 'Non, jamais, car c’est un soin non autorisé', 'Oui, pendant 3 minutes, comme un soigneur', 'Oui, uniquement pendant la pause de fin de manche'], 0,
          'Oui, sous réserve du respect de la règle de continuité du jeu.'],
        ['th-12', 174, 'Étant blessé, un joueur de double peut-il laisser son partenaire continuer seul la partie ?',
          ['Oui, si le joueur blessé sert et relance à son tour', 'Non, l’équipe doit abandonner la partie', 'Oui, sans condition, jusqu’à la fin de la partie', 'Oui, si le blessé reste sur le banc et ne joue plus'], 0,
          'Oui, à condition que le joueur blessé serve et relance à son tour.'],
        ['th-12', 175, 'Les 2 partenaires se précipitent pour jouer une balle. Leurs raquettes s’entrechoquent, mais une seule touche la balle : a) Est-ce une faute ? b) Les adversaires peuvent-ils prétendre avoir été gênés ?',
          ['a) Non ; b) Non', 'a) Oui ; b) Non', 'a) Non ; b) Oui', 'a) Oui ; b) Oui'], 0,
          '– a) Non.\n– b) Non.'],
        ['th-12', 176, 'Quand les relanceurs peuvent-ils changer leur position ?',
          ['Au début de chaque jeu', 'Au début de chaque manche', 'Uniquement après un jeu décisif', 'Jamais pendant la partie'], 1,
          'Au début de chaque manche.'],
        ['th-12', 177, 'En double, A et B jouent contre C et D. A sert au début de la partie, A et B gagnent la première manche 6/2. Qui doit servir au début de la deuxième manche ?',
          ['A ou B, au choix', 'A, qui a servi le premier jeu', 'B, obligatoirement', 'C ou D, au choix'], 0,
          'A ou B, au choix.'],
        ['th-12', 178, 'En double, A joue avec B. Au premier set, A relance sur la diagonale des égalités et B sur celle des avantages. À égalité, A choisit de recevoir et prétend pouvoir le faire de la diagonale des avantages. En a-t-il le droit ?',
          ['Oui, à égalité, l’équipe qui relance choisit librement la diagonale de son relanceur', 'Oui, à condition que l’adversaire et l’arbitre soient d’accord sur ce changement', 'Non, sa position de relanceur dans la manche impose le côté de la relance', 'Non, à égalité c’est obligatoirement B, relanceur de la diagonale des avantages, qui reçoit'], 2,
          'Non. Le choix du relanceur dans l’équipe (A ou B) a pour conséquence d’imposer le côté de la relance en fonction de sa position en tant que relanceur pour la manche en cours.'],
        ['th-13', 179, 'Vis-à-vis du changement de balles, pour combien de jeux l’échauffement compte-t-il ?',
          ['1 jeu', '2 jeux', 'Aucun jeu', '3 jeux'], 1,
          '2 jeux.'],
        ['th-13', 180, 'Le jeu décisif compte-t-il comme un jeu ordinaire pour le changement de balles ?',
          ['Oui', 'Non, il compte pour 2 jeux', 'Non, il ne compte pas', 'Oui, sauf au-delà de 12 points'], 0,
          'Oui.'],
        ['th-13', 181, 'Peut-on changer les balles avant un jeu décisif ?',
          ['Oui, dès que le nombre de jeux prévu pour le changement est atteint', 'Non, il faut attendre le début du deuxième jeu de la manche suivante', 'Oui, si le changement de balles était prévu à ce moment-là', 'Non, il faut attendre le premier jeu de la manche suivante'], 1,
          'Non, il faut, pour les changer, attendre le début du deuxième jeu de la manche suivante. De même, on ne change jamais les balles avant le début d’un super jeu décisif à 10 points.'],
        ['th-13', 182, 'On découvre que les balles n’ont pas été changées alors qu’elles auraient dû l’être. Décision ?',
          ['On change immédiatement les balles, au point suivant, quel que soit le joueur au service', 'On change dès que le joueur (ou l’équipe) qui devait servir avec des balles neuves sert à nouveau', 'On ne change plus les balles avant le prochain changement prévu, l’oubli étant définitif', 'On change les balles à la fin de la manche en cours, pour ne pas perturber le jeu'], 1,
          'Le changement doit être effectué dès que le joueur (ou l’équipe en double) qui aurait dû servir avec des balles neuves est appelé(e) à servir à nouveau.'],
        ['th-13', 183, 'Un changement de balles est prévu pour la troisième manche. Au milieu du premier jeu de la dernière manche, l’arbitre s’aperçoit qu’il a oublié le changement de balles. Puisqu’il ne s’agit pas d’un changement de balles à intervalle de jeux régulier, l’arbitre décide de les changer dès le deuxième jeu. Est-ce la bonne décision ?',
          ['Non, il faut attendre que ce joueur serve à nouveau, au troisième jeu', 'Oui, c’est la bonne décision, puisque le changement n’est pas régulier', 'Non, il fallait changer les balles immédiatement, au milieu du jeu', 'Non, il fallait ne plus changer les balles jusqu’à la fin du match'], 0,
          'Non, l’arbitre devra attendre que le joueur qui aurait dû servir avec les balles neuves au début de la troisième manche serve à nouveau, c’est-à-dire au troisième jeu de la manche.'],
        ['th-13', 184, 'Au premier point d’un jeu, après un premier service qui touche le filet puis tombe bon, l’arbitre se rend compte que le changement de balles a été oublié. Décision ?',
