<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b4461b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14.5' fill='%23d8ec3c' stroke='%23164430' stroke-width='1.5'/%3E%3Cpath d='M6.5 5.5c4.5 5 4.5 16 0 21M25.5 5.5c-4.5 5-4.5 16 0 21' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Quiz Arbitre · Juge-arbitre niveau 2</title>
  <style>
    :root {
      --clay: #b4461b;
      --clay-dark: #8e3412;
      --clay-soft: #fbe9df;
      --court: #1f5a3c;
      --court-dark: #164430;
      --court-soft: #e3f1e8;
      --wrong: #b42318;
      --wrong-soft: #fdeceb;
      --text: #1c2420;
      --muted: #56605a;
      --line: #e6dfd5;
      --bg: #faf7f2;
      --surface: #ffffff;
      --on-accent: #ffffff;
      --ball: #d8ec3c;
      --hard: #2f5f93;
      --hard-dark: #1f4470;
      --ball-art:
        radial-gradient(circle at -50% 50%, transparent 62%, rgba(255, 255, 255, .9) 63% 69%, transparent 70%),
        radial-gradient(circle at 150% 50%, transparent 62%, rgba(255, 255, 255, .9) 63% 69%, transparent 70%),
        var(--ball);

      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --fs-xs: 13px;
      --fs-sm: 14px;
      --fs-body: 16px;
      --fs-lg: 18px;
      --fs-xl: 22px;
      --fs-2xl: 28px;
      --fs-score: 64px;

      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;

      --r-sm: 8px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-pill: 999px;

      --shadow-card: 0 1px 2px rgba(60, 40, 20, .06), 0 4px 14px rgba(60, 40, 20, .07);
      --shadow-raised: 0 2px 4px rgba(60, 40, 20, .08), 0 10px 28px rgba(60, 40, 20, .12);
      --focus: 0 0 0 3px var(--bg), 0 0 0 5px var(--clay);

      --dur: 200ms;
      --ease: cubic-bezier(.2, .7, .3, 1);

      --tap: 48px;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: var(--fs-body);
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.01em; }

    button {
      font: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    button:focus-visible { outline: none; box-shadow: var(--focus); }
    [tabindex="-1"]:focus { outline: none; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    .screen { min-height: 100vh; min-height: 100dvh; }
    .screen[hidden] { display: none; }
    .screen.is-entering { animation: enter var(--dur) var(--ease); }
    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      min-height: var(--tap);
      padding: var(--sp-3) var(--sp-5);
      border: 2px solid transparent;
      border-radius: var(--r-md);
      font-size: var(--fs-body);
      font-weight: 700;
      cursor: pointer;
      transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease),
        transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-block { width: 100%; }
    /* Primary and secondary buttons are little courts: clay or grass, framed by a white line */
    .btn-primary,
    .btn-secondary {
      position: relative;
      isolation: isolate;
      padding-inline: 48px;
      border: 0;
      color: var(--on-accent);
      text-shadow: 0 1px 0 rgba(0, 0, 0, .18);
    }
    .btn-primary::before,
    .btn-secondary::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 4px;
      border: 1.5px solid rgba(255, 255, 255, .5);
      border-radius: calc(var(--r-md) - 4px);
      pointer-events: none;
    }
    .btn-primary {
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 5px),
        linear-gradient(180deg, #c4521f, var(--clay) 55%, #a63f17);
      box-shadow: 0 3px 0 var(--clay-dark), 0 8px 18px rgba(142, 52, 18, .26);
    }
    .btn-primary::after {
      content: "";
      position: absolute;
      top: 50%; right: 16px;
      width: 18px; height: 18px;
      margin-top: -9px;
      border-radius: var(--r-pill);
      background: var(--ball-art);
      box-shadow: inset -2px -2px 3px rgba(60, 80, 0, .25), 0 1px 2px rgba(0, 0, 0, .25);
      transition: transform 320ms var(--ease);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--clay-dark), 0 4px 10px rgba(142, 52, 18, .22); }
    .btn-primary:active:not(:disabled)::after { transform: rotate(-200deg) scale(.88); }
    .btn-secondary {
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .04) 0 14px, transparent 14px 28px),
        linear-gradient(180deg, #276b48, var(--court) 55%, #1a4d33);
      box-shadow: 0 3px 0 var(--court-dark), 0 8px 18px rgba(22, 68, 48, .22);
    }
    .btn-secondary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--court-dark), 0 4px 10px rgba(22, 68, 48, .2); }
    .btn-ghost {
      min-height: 44px;
      padding: var(--sp-2) var(--sp-3);
      background: transparent;
      color: var(--court);
      border-color: var(--line);
      font-size: var(--fs-sm);
    }
    .btn-ghost:active:not(:disabled) { background: var(--court-soft); }
    .btn-danger { background: var(--wrong); color: var(--on-accent); }
    .btn-danger:active:not(:disabled) { background: #8f1c13; }

    /* Home */
    .home-header {
      position: relative;
      padding: var(--sp-8) var(--sp-5) var(--sp-6);
      background:
        radial-gradient(120% 90% at 15% 0%, rgba(214, 102, 52, .55), transparent 60%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .03) 0 2px, transparent 2px 5px),
        linear-gradient(180deg, var(--clay), #a03d16);
      color: var(--on-accent);
      overflow: hidden;
      isolation: isolate;
    }
    /* Court lines: baseline on top, sidelines, service line and centre line running down to the net */
    .home-header::after,
    .score-header::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 10px 8px 0;
      border: 2px solid rgba(255, 255, 255, .42);
      border-bottom: 0;
      background:
        linear-gradient(rgba(255, 255, 255, .42), rgba(255, 255, 255, .42)) left bottom var(--service-line, 26px) / 100% 2px no-repeat,
        linear-gradient(rgba(255, 255, 255, .42), rgba(255, 255, 255, .42)) center bottom var(--centre-line-end, 0px) / 2px calc(var(--service-line, 26px) - var(--centre-line-end, 0px)) no-repeat;
      pointer-events: none;
    }
    .court-ball {
      position: absolute;
      top: -24px; right: -24px;
      width: 88px; height: 88px;
      border-radius: var(--r-pill);
      background: radial-gradient(circle at 35% 70%, rgba(255, 255, 255, .35), transparent 55%), var(--ball);
      box-shadow: inset -6px -8px 14px rgba(60, 80, 0, .28), 0 4px 14px rgba(60, 20, 0, .25);
      overflow: hidden;
      pointer-events: none;
    }
    .court-ball::before,
    .court-ball::after {
      content: "";
      position: absolute;
      top: 6%;
      width: 100%; height: 88%;
      border: 4px solid rgba(255, 255, 255, .95);
      border-radius: var(--r-pill);
    }
    .court-ball::before { left: -72%; }
    .court-ball::after { right: -72%; }
    .eyebrow {
      margin: 0 0 var(--sp-2);
      font-size: var(--fs-xs);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .92;
    }
    .home-header h1 { font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -.02em; }

    /* Brand title */
    .home-header .brand {
      font-family: var(--font-display);
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.015em;
      text-shadow: 0 2px 0 rgba(90, 25, 5, .35), 0 10px 24px rgba(90, 25, 5, .3);
    }
    .brand-main,
    .brand-accent { display: inline-block; animation: brand-in 700ms var(--ease) both; }
    .brand-accent { color: var(--ball); font-style: italic; animation-delay: 120ms; }
    .brand-tag {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      max-width: 320px;
      margin: var(--sp-3) 0 var(--sp-6);
      white-space: nowrap;
      font-size: var(--fs-xs);
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #fde6d8;
    }
    .brand-tag::before,
    .brand-tag::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, .55);
      transform-origin: left;
      animation: rule-in 800ms 200ms var(--ease) both;
    }
    .brand-tag::before { flex: none; width: 24px; }
    .home-header .court-ball { animation: ball-roll-in 900ms var(--ease) both; }
    @keyframes brand-in {
      from { opacity: 0; transform: translateY(14px); letter-spacing: .06em; }
      to { opacity: 1; transform: none; }
    }
    @keyframes rule-in { from { transform: scaleX(0); } }
    @keyframes ball-roll-in {
      from { opacity: 0; transform: translate(110px, -30px) rotate(240deg); }
      to { opacity: 1; transform: none; }
    }

    .home-body { padding: var(--sp-5) var(--sp-4) var(--sp-8); }

    .notice {
      display: flex;
      gap: var(--sp-3);
      margin: 0 0 var(--sp-6);
      padding: var(--sp-3) var(--sp-4);
      background: var(--clay-soft);
      border-left: 4px solid var(--clay);
      border-radius: var(--r-sm);
      font-size: var(--fs-sm);
      color: var(--text);
    }
    .notice-icon { flex: none; font-weight: 800; color: var(--clay-dark); }
    .notice p { margin: 0; }

    .section-title {
      margin: 0 0 var(--sp-3);
      font-size: var(--fs-lg);
      font-weight: 800;
      color: var(--court);
    }

    .theme-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-3); }
    .theme-card {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 20px;
      gap: var(--sp-3);
      align-items: center;
      width: 100%;
      padding: var(--sp-4);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
      text-align: left;
      cursor: pointer;
      transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .theme-card:active { transform: scale(.985); box-shadow: var(--shadow-raised); border-color: var(--clay); }
    .theme-num {
      display: grid;
      place-items: center;
      width: 40px; height: 40px;
      border-radius: var(--r-pill);
      background: var(--ball-art);
      box-shadow: inset -2px -3px 5px rgba(60, 80, 0, .2);
      color: var(--court-dark);
      font-weight: 800;
      transition: transform 400ms var(--ease);
    }
    .theme-card:active .theme-num { transform: rotate(-360deg) scale(1.08); }

    /* Theme icon: a little court tile (clay, grass or hard court in turn) with the theme's pictogram */
    .theme-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 48px; height: 48px;
      border-radius: var(--r-md);
      color: var(--on-accent);
      box-shadow: 0 3px 0 var(--tile-edge), 0 6px 14px rgba(28, 36, 32, .16);
      isolation: isolate;
      transition: transform 300ms var(--ease);
    }
    .theme-icon::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 4px;
      border: 1.5px solid rgba(255, 255, 255, .4);
      border-radius: 9px;
    }
    .theme-icon.is-clay,
    .badge-medal.is-clay { --tile-edge: var(--clay-dark); background: linear-gradient(160deg, #cc5a26, var(--clay) 60%, #9c3a14); }
    .theme-icon.is-grass,
    .badge-medal.is-grass { --tile-edge: var(--court-dark); background: linear-gradient(160deg, #2f7a52, var(--court) 60%, #1a4d33); }
    .theme-icon.is-hard,
    .badge-medal.is-hard { --tile-edge: var(--hard-dark); background: linear-gradient(160deg, #3d75b0, var(--hard) 60%, #244b78); }
    .theme-icon svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .2)); }
    .theme-icon .theme-num {
      position: absolute;
      right: -7px; bottom: -7px;
      width: 22px; height: 22px;
      font-size: 11px;
      line-height: 1;
      box-shadow: inset -1px -2px 3px rgba(60, 80, 0, .25), 0 0 0 2px var(--surface);
    }
    .theme-card:active .theme-icon { transform: translateY(2px); }
    .theme-name { display: block; font-size: var(--fs-body); font-weight: 750; line-height: 1.3; color: var(--text); }
    .theme-desc { display: block; margin-top: var(--sp-1); font-size: var(--fs-sm); color: var(--muted); }
    .theme-count {
      display: inline-block;
      margin-top: var(--sp-2);
      padding: 2px var(--sp-2);
      border-radius: var(--r-pill);
      background: var(--clay-soft);
      color: var(--clay-dark);
      font-size: var(--fs-xs);
      font-weight: 700;
    }
    .theme-arrow { color: var(--clay); font-size: var(--fs-xl); font-weight: 700; line-height: 1; }

    /* Quiz */
    .quiz-header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: var(--sp-3) var(--sp-4) var(--sp-3);
      background: rgba(250, 247, 242, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(6px);
    }
    .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
    .quiz-theme {
      margin: 0;
      min-width: 0;
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--court);
      line-height: 1.3;
    }
    .progress-row { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-2); }
    .progress-label { flex: none; font-size: var(--fs-sm); font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .progress-track { flex: 1; height: 8px; border-radius: var(--r-pill); background: var(--line); overflow: hidden; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--clay); transition: width var(--dur) var(--ease); }
    .quiz-header .progress-track { overflow: visible; }
    #progress-fill { position: relative; }
    #progress-fill::after {
      content: "";
      position: absolute;
      top: 50%; right: -7px;
      width: 14px; height: 14px;
      border: 1.5px solid var(--court-dark);
      border-radius: var(--r-pill);
      background: var(--ball);
      transform: translateY(-50%);
    }

    .quiz-body { padding: var(--sp-5) var(--sp-4) 120px; }
    .statement { font-size: var(--fs-xl); font-weight: 750; line-height: 1.3; }

    .choices { list-style: none; margin: var(--sp-5) 0 0; padding: 0; display: grid; gap: var(--sp-3); }
    .choice {
      position: relative;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 28px;
      align-items: center;
      gap: var(--sp-3);
      width: 100%;
      min-height: 64px;
      padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: 0 2px 0 var(--line), var(--shadow-card);
      overflow: hidden;
      text-align: left;
      font-size: var(--fs-body);
      cursor: pointer;
      transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease),
        transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    .choice:active:not(:disabled) { transform: translateY(2px); border-color: var(--clay); box-shadow: 0 0 0 var(--line), var(--shadow-card); }
    .choice:active:not(:disabled) .choice-letter { background: var(--ball-art); border-color: var(--court-dark); color: var(--court-dark); transform: rotate(-20deg); }
    .choice:disabled { cursor: default; }
    /* A side line runs down the left edge of each answer, coloured once the call is made */
    .choice::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: var(--court-soft);
      transition: background-color var(--dur) var(--ease);
    }
    .choice-letter {
      display: grid;
      place-items: center;
      width: 40px; height: 40px;
      border-radius: var(--r-pill);
      background: var(--bg);
      border: 1.5px solid var(--court-soft);
      box-shadow: inset 0 -2px 0 rgba(31, 90, 60, .08);
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-weight: 700;
      color: var(--court);
      transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease), transform 300ms var(--ease);
    }
    .choice-label { line-height: 1.4; }
    .choice-mark {
      display: grid;
      place-items: center;
      width: 28px; height: 28px;
      border-radius: var(--r-pill);
      font-size: var(--fs-body);
      font-weight: 800;
      color: var(--on-accent);
    }
    .choice.is-correct { background: linear-gradient(90deg, var(--court-soft), var(--surface) 85%); border-color: var(--court); box-shadow: 0 2px 0 var(--court), var(--shadow-card); }
    .choice.is-correct::before { background: var(--court); }
    .choice.is-correct .choice-letter { background: var(--court); border-color: var(--court); color: var(--on-accent); }
    .choice.is-correct .choice-mark { background: var(--court); }
    .choice.is-wrong { background: linear-gradient(90deg, var(--wrong-soft), var(--surface) 85%); border-color: var(--wrong); box-shadow: 0 2px 0 var(--wrong), var(--shadow-card); }
    .choice.is-wrong::before { background: var(--wrong); }
    .choice.is-wrong .choice-letter { background: var(--wrong); border-color: var(--wrong); color: var(--on-accent); }
    .choice.is-wrong .choice-mark { background: var(--wrong); }
    .choice.is-dimmed { opacity: .5; box-shadow: none; filter: grayscale(.6); }

    .feedback {
      margin-top: var(--sp-5);
      padding: var(--sp-4);
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 6px solid var(--court);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      animation: enter var(--dur) var(--ease);
    }
    .feedback[hidden] { display: none; }
    .feedback.is-wrong { border-left-color: var(--wrong); }
    .feedback-title { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-lg); font-weight: 800; color: var(--court); }
    .feedback.is-wrong .feedback-title { color: var(--wrong); }
    .feedback-icon {
      display: grid; place-items: center;
      width: 28px; height: 28px;
      border-radius: var(--r-pill);
      background: currentColor;
    }
    .feedback-icon span { color: var(--on-accent); font-size: var(--fs-body); line-height: 1; }
    .feedback-text { margin: var(--sp-3) 0 0; white-space: pre-line; }
    .feedback-ref { margin: var(--sp-3) 0 0; font-size: var(--fs-sm); color: var(--muted); }
    .feedback-ref strong { color: var(--text); }

    .action-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      padding: var(--sp-3) var(--sp-4) calc(var(--sp-3) + env(safe-area-inset-bottom));
      background: rgba(250, 247, 242, .97);
      border-top: 1px solid var(--line);
      box-shadow: 0 -6px 18px rgba(60, 40, 20, .08);
      transform: translateY(0);
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    .action-bar.is-hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }

    /* Score */
    .score-header {
      --service-line: 40px;
      --centre-line-end: 18px;
      position: relative;
      padding: var(--sp-8) var(--sp-5) 56px;
      background: var(--court);
      color: var(--on-accent);
      text-align: center;
      overflow: hidden;
      isolation: isolate;
    }
    /* Net: white tape over a mesh */
    .score-header::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 0; right: 0; bottom: 0;
      height: 18px;
      border-top: 4px solid rgba(255, 255, 255, .55);
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .22) 0 1px, transparent 1px 6px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .22) 0 1px, transparent 1px 6px);
      pointer-events: none;
    }
    .score-header .eyebrow { opacity: .9; }
    .score-value { margin: var(--sp-2) 0 0; font-size: var(--fs-score); font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
    .score-value small { font-size: var(--fs-2xl); font-weight: 700; opacity: .85; }
    .score-message { margin: var(--sp-4) auto 0; max-width: 32ch; font-size: var(--fs-body); }
    .score-body { padding: var(--sp-5) var(--sp-4) var(--sp-8); }
    .score-actions { display: grid; gap: var(--sp-3); margin-bottom: var(--sp-6); }

    .recap { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-2); }
    .recap-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: var(--sp-3);
      align-items: start;
      padding: var(--sp-3);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      font-size: var(--fs-sm);
    }
    .recap-mark {
      display: grid; place-items: center;
      width: 28px; height: 28px;
      border-radius: var(--r-pill);
      color: var(--on-accent);
      font-weight: 800;
      background: var(--court);
    }
    .recap-item.is-wrong .recap-mark { background: var(--wrong); }
    .recap-status { display: block; font-size: var(--fs-xs); font-weight: 700; color: var(--court); }
    .recap-item.is-wrong .recap-status { color: var(--wrong); }

    /* Statistics */
    .home-stats { margin: 0 0 var(--sp-6); }
    .score-actions .btn-ghost { min-height: var(--tap); }
    .progress-fill.is-high { background: var(--court); }
    .progress-fill.is-low { background: var(--wrong); }

    .stats-header { padding-top: var(--sp-4); padding-bottom: var(--sp-8); }
    /* Retour and Quitter: pills led by a round icon */
    .btn-back,
    .btn-quit {
      min-height: 44px;
      padding: var(--sp-1) var(--sp-4) var(--sp-1) var(--sp-1);
      border-radius: var(--r-pill);
      font-size: var(--fs-sm);
    }
    .btn-pill-icon {
      display: grid;
      place-items: center;
      width: 34px; height: 34px;
      border-radius: var(--r-pill);
      transition: transform 300ms var(--ease);
    }
    .btn-pill-icon svg { width: 18px; height: 18px; }
    .stats-back {
      position: relative;
      margin: 0 0 var(--sp-5);
      color: var(--on-accent);
      background: rgba(255, 255, 255, .14);
      border: 1.5px solid rgba(255, 255, 255, .5);
      backdrop-filter: blur(4px);
    }
    .stats-back .btn-pill-icon {
      background: var(--ball-art);
      color: var(--court-dark);
      box-shadow: inset -2px -3px 4px rgba(60, 80, 0, .25), 0 2px 4px rgba(60, 20, 0, .25);
    }
    .stats-back:active:not(:disabled) { background: rgba(255, 255, 255, .24); }
    .stats-back:active:not(:disabled) .btn-pill-icon { transform: translateX(-3px) rotate(-90deg); }
    .btn-quit {
      flex: none;
      color: var(--text);
      background: var(--surface);
      border: 1.5px solid var(--line);
      box-shadow: var(--shadow-card);
    }
    .btn-quit .btn-pill-icon { background: var(--wrong-soft); color: var(--wrong); }
    .btn-quit:active:not(:disabled) { border-color: var(--wrong); }
    .btn-quit:active:not(:disabled) .btn-pill-icon { transform: translateX(2px); }
    .stats-section { margin: 0 0 var(--sp-8); }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--sp-3);
      margin: 0 0 var(--sp-8);
    }
    .stat {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: var(--sp-1);
      padding: var(--sp-4) var(--sp-2);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    .stat dt { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .stat dd { margin: 0; font-size: var(--fs-2xl); font-weight: 800; line-height: 1.1; color: var(--court); font-variant-numeric: tabular-nums; }

    .theme-card.is-weak { grid-template-columns: 52px minmax(0, 1fr) auto; border-left: 4px solid var(--wrong); }
    .theme-card.is-weak:active { border-color: var(--wrong); }
    .theme-card.is-weak .theme-desc { color: var(--wrong); font-weight: 700; }
    .weak-rate {
      padding: var(--sp-1) var(--sp-3);
      border-radius: var(--r-pill);
      background: var(--wrong-soft);
      color: var(--wrong);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stats-note {
      margin: 0;
      padding: var(--sp-3) var(--sp-4);
      background: var(--court-soft);
      border-left: 4px solid var(--court);
      border-radius: var(--r-sm);
      font-size: var(--fs-sm);
    }

    .chart-card {
      padding: var(--sp-4);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
    }
    .chart-caption { margin: 0 0 var(--sp-4); font-size: var(--fs-sm); font-weight: 700; }
    .chart {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: var(--sp-2);
      align-items: end;
    }
    .chart-item { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); min-width: 0; }
    .chart-bar {
      display: flex;
      align-items: flex-end;
      width: 100%;
      max-width: 28px;
      height: 120px;
      border-radius: var(--r-sm) var(--r-sm) 0 0;
      background: var(--bg);
      border-bottom: 2px solid var(--line);
    }
    .chart-fill { width: 100%; min-height: 4px; border-radius: inherit; background: var(--clay); transition: height var(--dur) var(--ease); }
    .chart-fill.is-high { background: var(--court); }
    .chart-fill.is-low { background: var(--wrong); }
    .chart-label { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
    .chart-range { margin: var(--sp-3) 0 0; padding-top: var(--sp-2); border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); }

    .theme-card.is-stat { grid-template-columns: 52px minmax(0, 1fr); align-items: start; cursor: default; }
    .theme-card.is-stat:active { transform: none; box-shadow: var(--shadow-card); border-color: var(--line); }
    .theme-card.is-unplayed .theme-icon { filter: grayscale(1); opacity: .4; }
    .stat-row { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-2); }
    .stat-rate { flex: none; min-width: 44px; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }

    .stats-empty {
      display: grid;
      justify-items: center;
      gap: var(--sp-4);
      padding: var(--sp-8) var(--sp-5) var(--sp-6);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    .stats-empty-icon {
      display: grid;
      place-items: center;
      width: 56px; height: 56px;
      border-radius: var(--r-pill);
      background: var(--court-soft);
      color: var(--court);
      font-size: var(--fs-xl);
      font-weight: 800;
    }
    .stats-empty p { margin: 0; }

    /* Statistics, tennis look: scoreboard, grass-court chart, balls at the end of each gauge */
    .stats-header h1 { font-family: var(--font-display); font-size: 40px; font-weight: 700; letter-spacing: -.01em; }
    .stats-header .court-ball { animation: ball-roll-in 900ms var(--ease) both; }

    .stats-section .section-title { display: flex; align-items: center; gap: var(--sp-2); }
    .stats-section .section-title::before {
      content: "";
      flex: none;
      width: 14px; height: 14px;
      border-radius: var(--r-pill);
      background: var(--ball-art);
      box-shadow: inset -1px -2px 2px rgba(60, 80, 0, .25), 0 0 0 1.5px var(--court-dark);
    }

    .stats-summary {
      position: relative;
      gap: 0;
      padding: var(--sp-4) var(--sp-2);
      border-radius: var(--r-lg);
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .035) 0 22px, transparent 22px 44px),
        linear-gradient(180deg, #276b48, var(--court-dark));
      box-shadow: 0 4px 0 #0f3022, var(--shadow-raised);
      isolation: isolate;
    }
    .stats-summary::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 6px;
      border: 1.5px solid rgba(255, 255, 255, .35);
      border-radius: calc(var(--r-lg) - 6px);
    }
    .stats-summary .stat {
      padding: var(--sp-2);
      background: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      animation: score-in 500ms var(--ease) both;
    }
    .stats-summary .stat + .stat { border-left: 1.5px solid rgba(255, 255, 255, .35); }
    .stats-summary .stat:nth-child(2) { animation-delay: 80ms; }
    .stats-summary .stat:nth-child(3) { animation-delay: 160ms; }
    .stats-summary dt { color: rgba(255, 255, 255, .78); letter-spacing: .12em; }
    .stats-summary dd { font-size: 30px; color: var(--ball); text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }

    .theme-card.is-weak .weak-rate { background: var(--wrong); color: var(--on-accent); }

    .chart {
      position: relative;
      padding: var(--sp-5) var(--sp-3) var(--sp-1);
      border-radius: var(--r-md);
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .04) 0 18px, transparent 18px 36px),
        linear-gradient(180deg, #276b48, var(--court));
      isolation: isolate;
    }
    .chart-item { padding-bottom: var(--sp-2); }
    /* Each bar carries a slice of the net at 50 %: the gaps between bars make it a dashed line */
    .chart-bar {
      background: linear-gradient(rgba(255, 255, 255, .5), rgba(255, 255, 255, .5)) center / 100% 1.5px no-repeat, rgba(255, 255, 255, .08);
      border-bottom: 2px solid rgba(255, 255, 255, .85);
    }
    .chart-fill {
      position: relative;
      min-height: 6px;
      background: linear-gradient(180deg, #e8865a, #cf5f2e);
      animation: bar-grow 700ms var(--ease) both;
      animation-delay: calc(var(--i, 0) * 60ms);
    }
    .chart-fill.is-high { background: linear-gradient(180deg, #e6f47a, var(--ball)); }
    .chart-fill.is-low { background: linear-gradient(180deg, #ff8f7d, #e5533f); }
    .chart-fill::after {
      content: "";
      position: absolute;
      top: -7px; left: 50%;
      width: 12px; height: 12px;
      margin-left: -6px;
      border-radius: var(--r-pill);
      background: var(--ball-art);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    }
    .chart-label { color: rgba(255, 255, 255, .9); }
    @keyframes bar-grow { from { height: 0; } }

    .stat-row .progress-track { height: 10px; overflow: visible; background: var(--court-soft); box-shadow: inset 0 0 0 1px rgba(31, 90, 60, .12); }
    .stat-row .progress-fill {
      position: relative;
      background: linear-gradient(90deg, #cf5f2e, var(--clay));
      animation: gauge-grow 800ms var(--ease) both;
    }
    .stat-row .progress-fill.is-high { background: linear-gradient(90deg, #2f7a52, var(--court)); }
    .stat-row .progress-fill.is-low { background: linear-gradient(90deg, #d4483a, var(--wrong)); }
    .stat-row .progress-fill[style]::after {
      content: "";
      position: absolute;
      top: 50%; right: -8px;
      width: 16px; height: 16px;
      margin-top: -8px;
      border-radius: var(--r-pill);
      background: var(--ball-art);
      box-shadow: 0 0 0 1.5px var(--court-dark), 0 1px 3px rgba(0, 0, 0, .25);
    }
    @keyframes gauge-grow { from { width: 0; } }
    .stat-rate { margin-left: var(--sp-2); }
    .stat-rate.is-high { color: var(--court); }
    .stat-rate.is-low { color: var(--wrong); }

    .theme-card.is-stat.is-unplayed { padding-block: var(--sp-3); background: transparent; border-style: dashed; box-shadow: none; }
    .theme-card.is-unplayed .theme-name { color: var(--muted); font-weight: 650; }
    .theme-card.is-unplayed .stat-row { display: none; }

    .stats-empty-icon { width: 64px; height: 64px; background: var(--ball-art); color: var(--court-dark); box-shadow: inset -3px -4px 6px rgba(60, 80, 0, .25); }

    /* Gamification: player card, XP bar, badges */
    .player {
      margin: 0 0 var(--sp-4);
      padding: var(--sp-4);
      border-radius: var(--r-lg);
      color: var(--on-accent);
      background:
        radial-gradient(120% 100% at 100% 0%, rgba(216, 236, 60, .2), transparent 55%),
        linear-gradient(160deg, #276b48, var(--court-dark));
      box-shadow: 0 4px 0 #0f3022, var(--shadow-raised);
    }
    .player-top { display: flex; align-items: center; gap: var(--sp-3); }
    .player-level {
      display: grid;
      place-items: center;
      flex: none;
      width: 52px; height: 52px;
      border-radius: var(--r-pill);
      background: var(--ball-art);
      color: var(--court-dark);
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      font-weight: 700;
      box-shadow: inset -3px -4px 6px rgba(60, 80, 0, .28), 0 0 0 3px rgba(255, 255, 255, .25);
      animation: medal-pop 700ms var(--ease) both;
    }
    .player-kicker { margin: 0; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .78); }
    .player-rank { margin: 0; font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 700; line-height: 1.2; }
    .xp-track { height: 10px; margin-top: var(--sp-3); border-radius: var(--r-pill); background: rgba(255, 255, 255, .16); overflow: hidden; }
    .xp-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #b9d82a, var(--ball)); transition: width 900ms var(--ease); }
    .player-hint { margin: var(--sp-2) 0 0; font-size: var(--fs-xs); color: rgba(255, 255, 255, .82); }
    .player-facts {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--sp-2);
      margin: var(--sp-3) 0 0;
      padding: var(--sp-3) 0 0;
      border-top: 1px solid rgba(255, 255, 255, .18);
      text-align: center;
    }
    .player-facts strong { display: block; font-size: var(--fs-lg); font-weight: 800; line-height: 1.2; color: var(--ball); font-variant-numeric: tabular-nums; }
    .player-facts span { display: block; font-size: 12px; line-height: 1.3; color: rgba(255, 255, 255, .8); }

    .gains {
      margin: 0 0 var(--sp-5);
      padding: var(--sp-4);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
    }
    .gains[hidden] { display: none; }
    .gains-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); }
    .gains-xp { margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1; color: var(--clay); white-space: nowrap; animation: score-in 500ms 300ms var(--ease) both; }
    .gains-rank { margin: 0; font-size: var(--fs-sm); font-weight: 700; color: var(--court); text-align: right; }
    .gains .xp-track { background: var(--court-soft); }
    .gains .xp-fill { background: linear-gradient(90deg, #2f7a52, var(--court)); }
    .gains-note { margin: var(--sp-3) 0 0; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); background: var(--clay-soft); color: var(--clay-dark); font-size: var(--fs-sm); font-weight: 700; }
    .gains-note.is-up { background: var(--court-soft); color: var(--court-dark); }
    .new-badges { list-style: none; display: grid; gap: var(--sp-3); margin: var(--sp-4) 0 0; padding: 0; }
    .new-badge {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: var(--sp-3);
      align-items: center;
      padding: var(--sp-3);
      border: 1px solid #e6dc8f;
      border-radius: var(--r-md);
      background: linear-gradient(90deg, #f8f4d2, var(--surface));
      font-size: var(--fs-sm);
      animation: enter 500ms var(--ease) both;
      animation-delay: calc(var(--i, 0) * 150ms + 500ms);
    }
    .new-badge .badge-medal { animation: medal-pop 700ms var(--ease) both; animation-delay: calc(var(--i, 0) * 150ms + 600ms); }
    .new-badge-kicker { display: block; font-size: var(--fs-xs); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--clay-dark); }
    .new-badge strong { display: block; font-size: var(--fs-body); }

    .badge-medal {
      position: relative;
      display: grid;
      place-items: center;
      flex: none;
      width: 56px; height: 56px;
      border-radius: var(--r-pill);
      color: var(--on-accent);
      box-shadow: 0 0 0 3px var(--ball), 0 0 0 5px rgba(28, 36, 32, .12), 0 6px 14px rgba(28, 36, 32, .2);
      isolation: isolate;
    }
    .badge-medal::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 5px;
      border: 1.5px dashed rgba(255, 255, 255, .45);
      border-radius: var(--r-pill);
    }
    .badge-medal svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .2)); }
    .badge-grid { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); margin: 0; padding: 0; }
    .badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-1);
      padding: var(--sp-4) var(--sp-2) var(--sp-3);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    .badge .badge-medal { margin-bottom: var(--sp-2); }
    .badge-name { font-size: var(--fs-sm); font-weight: 800; line-height: 1.25; }
    .badge-desc { font-size: 12px; line-height: 1.3; color: var(--muted); }
    .badge.is-locked { background: transparent; border-style: dashed; box-shadow: none; }
    .badge.is-locked .badge-medal { background: var(--line); color: var(--muted); box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line); }
    .badge.is-locked .badge-medal::before { border-color: rgba(28, 36, 32, .15); }
    .badge.is-locked .badge-name { color: var(--muted); }
    .badge-progress { display: flex; align-items: center; gap: var(--sp-2); width: 100%; margin-top: var(--sp-2); font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
    .badge-progress .progress-track,
    .badge-progress .progress-fill { display: block; }
    .badge-progress .progress-track { height: 6px; }
    @keyframes medal-pop {
      0% { opacity: 0; transform: scale(0) rotate(-40deg); }
      60% { opacity: 1; transform: scale(1.15) rotate(8deg); }
      100% { opacity: 1; transform: none; }
    }

    /* Confirm dialog */
    .confirm {
      width: calc(100% - 2 * var(--sp-5));
      max-width: 360px;
      padding: var(--sp-6) var(--sp-5) var(--sp-5);
      border: none;
      border-radius: var(--r-lg);
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-raised);
    }
    .confirm[open] { animation: enter var(--dur) var(--ease); }
    .confirm::backdrop { background: rgba(28, 36, 32, .5); }
    .confirm h2 { font-size: var(--fs-xl); font-weight: 800; }
    .confirm p { margin: var(--sp-2) 0 var(--sp-5); color: var(--muted); }
    .confirm-actions { display: grid; gap: var(--sp-3); }

    /* Quiz rally: each question comes in from across the net, the call lands on the picked answer */
    #quiz.is-entering .quiz-body { animation: rally 320ms var(--ease); }
    @keyframes rally {
      from { opacity: 0; transform: translateX(28px); }
      to { opacity: 1; transform: none; }
    }
    .choice.is-correct .choice-mark,
    .choice.is-wrong .choice-mark { animation: call-pop 420ms var(--ease); }
    .choice.is-correct,
    .choice.is-wrong { animation: impact 360ms var(--ease); }
    @keyframes call-pop {
      0% { transform: scale(0) rotate(-40deg); }
      60% { transform: scale(1.35) rotate(8deg); }
      100% { transform: none; }
    }
    @keyframes impact {
      0% { transform: scale(1); }
      35% { transform: scale(1.025, .96); }
      100% { transform: none; }
    }

    /* Score: the ball drops onto the court and the score is called */
    .score-header .court-ball {
      top: 22px; right: 22px;
      width: 34px; height: 34px;
      animation: ball-drop 1100ms 150ms both;
    }
    .score-header .court-ball::before,
    .score-header .court-ball::after { border-width: 2.5px; }
    .score-call {
      margin: var(--sp-2) 0 0;
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-style: italic;
      color: var(--ball);
      animation: brand-in 600ms 250ms var(--ease) both;
    }
    .score-value { animation: score-in 500ms 200ms var(--ease) both; }
    @keyframes score-in {
      from { opacity: 0; transform: scale(.7); }
      to { opacity: 1; transform: none; }
    }
    @keyframes ball-drop {
      0% { opacity: 0; transform: translateY(-80px); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
      12% { opacity: 1; }
      42% { transform: translateY(0) scale(1.18, .82); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
      64% { transform: translateY(-24px); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
      80% { transform: translateY(0) scale(1.08, .92); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
      90% { transform: translateY(-6px); animation-timing-function: ease-in; }
      100% { opacity: 1; transform: none; }
    }

    /* Theme intro: the ball is served across the screen, bounces, then grows to fill it */
    .serve { position: fixed; inset: 0; z-index: 10; overflow: hidden; cursor: pointer; }
    .serve[hidden] { display: none; }
    .serve-ball {
      position: absolute;
      left: 0; top: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 70%, rgba(255, 255, 255, .35), transparent 55%), var(--ball);
      box-shadow: inset calc(var(--seam) * -1.4) calc(var(--seam) * -1.8) calc(var(--seam) * 3.2) rgba(60, 80, 0, .28);
      overflow: hidden;
      will-change: transform;
    }
    .serve-seams { position: absolute; inset: 0; border-radius: inherit; }
    .serve-seams::before,
    .serve-seams::after {
      content: "";
      position: absolute;
      top: 6%;
      width: 100%; height: 88%;
      border: var(--seam) solid rgba(255, 255, 255, .95);
      border-radius: 50%;
    }
    .serve-seams::before { left: -72%; }
    .serve-seams::after { right: -72%; }
    .serve-card {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: var(--sp-3);
      padding: var(--sp-6);
      color: var(--court-dark);
      text-align: center;
      opacity: 0;
    }
    .serve-icon { display: grid; place-items: center; width: 72px; height: 72px; margin-bottom: var(--sp-2); border: 3px solid currentColor; border-radius: var(--r-pill); }
    .serve-icon svg { width: 38px; height: 38px; }
    .serve-kicker { margin: 0; font-size: var(--fs-sm); font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .serve-name {
      margin: 0;
      max-width: 15ch;
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.1;
    }
    .serve-call {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin: var(--sp-2) 0 0;
      font-size: var(--fs-xs);
      font-weight: 800;
      letter-spacing: .3em;
      text-transform: uppercase;
    }
    .serve-call::before,
    .serve-call::after { content: ""; width: 28px; height: 2px; background: currentColor; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section id="home" class="screen" aria-labelledby="home-title">
      <header class="home-header">
        <span class="court-ball" aria-hidden="true"></span>
        <p class="eyebrow">Examen FFT</p>
        <h1 id="home-title" class="brand"><span class="brand-main">Quiz</span> <span class="brand-accent">Arbitre</span></h1>
        <p class="brand-tag">Juge-arbitre · Niveau 2</p>
      </header>
      <div class="home-body">
        <aside class="notice" aria-label="Avertissement">
          <span class="notice-icon" aria-hidden="true">i</span>

        </aside>
        <section class="player" id="player" aria-label="Ma progression"></section>
        <button type="button" class="btn btn-secondary btn-block home-stats" id="home-stats-btn">Mes statistiques</button>
        <h2 class="section-title">Choisis un thème</h2>
        <ul class="theme-list" id="theme-list"></ul>
      </div>
    </section>

    <section id="quiz" class="screen" aria-labelledby="question-statement" hidden>
      <header class="quiz-header">
        <div class="quiz-top">
          <p class="quiz-theme" id="quiz-theme"></p>
          <button type="button" class="btn btn-quit" id="quit-btn"><span class="btn-pill-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9"/></svg></span>Quitter</button>
        </div>
        <div class="progress-row">
          <span class="progress-label" id="progress-label"></span>
          <div class="progress-track" role="progressbar" aria-label="Progression de la série" aria-valuemin="0" id="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </header>
      <div class="quiz-body">
        <h2 class="statement" id="question-statement" tabindex="-1"></h2>
        <ol class="choices" id="choices"></ol>
        <div class="feedback" id="feedback" role="status" hidden>
          <p class="feedback-title"><span class="feedback-icon" aria-hidden="true"><span id="feedback-icon"></span></span><span id="feedback-title"></span></p>
          <p class="feedback-text" id="feedback-text"></p>
          <p class="feedback-ref"><strong>Référence :</strong> <span id="feedback-ref"></span></p>
        </div>
      </div>
      <div class="action-bar is-hidden" id="action-bar">
        <button type="button" class="btn btn-primary btn-block" id="next-btn" disabled>Question suivante</button>
      </div>
    </section>

    <section id="score" class="screen" aria-labelledby="score-title" hidden>
      <header class="score-header">
        <span class="court-ball" aria-hidden="true"></span>
        <p class="eyebrow" id="score-theme"></p>
        <p class="score-call">Jeu, set et match</p>
        <h1 id="score-title" tabindex="-1" class="score-value"></h1>
        <p class="score-message" id="score-message"></p>
      </header>
      <div class="score-body">
        <section class="gains" id="gains" aria-label="Gains de la série" hidden></section>
        <div class="score-actions">
          <button type="button" class="btn btn-primary btn-block" id="replay-btn">Rejouer ce thème</button>
          <button type="button" class="btn btn-secondary btn-block" id="home-btn">Retour aux thèmes</button>
          <button type="button" class="btn btn-ghost btn-block" id="score-stats-btn">Voir mes statistiques</button>
        </div>
        <h2 class="section-title">Récapitulatif</h2>
        <ol class="recap" id="recap"></ol>
      </div>
    </section>

    <section id="stats" class="screen" aria-labelledby="stats-title" hidden>
      <header class="home-header stats-header">
        <span class="court-ball" aria-hidden="true"></span>
        <button type="button" class="btn btn-back stats-back" id="stats-back-btn"><span class="btn-pill-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg></span>Retour</button>
        <p class="eyebrow">Progression</p>
        <h1 id="stats-title" tabindex="-1">Mes statistiques</h1>
      </header>
      <div class="home-body" id="stats-body"></div>
    </section>
  </main>

  <div class="serve" id="serve" aria-hidden="true" hidden>
    <span class="serve-ball" id="serve-ball"><span class="serve-seams" id="serve-seams"></span></span>
    <div class="serve-card" id="serve-card">
      <span class="serve-icon" id="serve-icon"></span>
      <p class="serve-kicker" id="serve-kicker"></p>
      <p class="serve-name" id="serve-name"></p>
      <p class="serve-call" id="serve-call"></p>
    </div>
  </div>

  <dialog class="confirm" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <h2 id="confirm-title">Quitter la série ?</h2>
    <p id="confirm-text">Ta progression sera perdue.</p>
    <div class="confirm-actions">
      <button type="button" class="btn btn-primary btn-block" id="confirm-stay">Continuer la série</button>
      <button type="button" class="btn btn-secondary btn-block" id="confirm-quit">Quitter</button>
    </div>
  </dialog>

  <script>

      // [theme_id, n° dans le livret, énoncé, propositions (4, ou Vrai/Faux), index de la bonne réponse, explication]
      const raw = [
        ['th-01', 1, 'Laquelle de ces actions fait partie des responsabilités de l’arbitre avant son match ?',
          ['Se munir de balles neuves et usagées', 'Attendre sur sa chaise que le juge-arbitre lui apporte la feuille d’arbitrage', 'Arriver sur le court en même temps que les joueurs, au moment de l’appel', 'Fixer lui-même le nombre de balles et la fréquence des changements'], 0,
          '– S’assurer de son affectation : court, heure, partie.\n– Informer le juge-arbitre ou le chef des arbitres d’éventuels problèmes potentiels quant à son affectation : contentieux avec un joueur, par exemple.\n– S’assurer de la procédure d’appel du match.\n– Préparer son matériel : chronomètre, crayons (2), gomme, plaquette d’arbitrage, etc.\n– Se munir de balles neuves et usagées.\n– Récupérer sa feuille d’arbitrage et la préparer, ainsi que les balles, les serviettes ou les boissons si nécessaire.\n– S’informer d’éventuelles règles spécifiques à l’épreuve, ainsi que des conditions de jeu (jeu décisif, changement de balles, nombre de balles, etc.).\n– Suivre l’évolution des parties sur le court où il est affecté ; il faut de préférence arriver sur le court avant les joueurs.\n– Se restaurer et passer aux toilettes, une partie peut être longue.\n– Se munir de quoi se protéger de la pluie, du froid ou du soleil.'],
        ['th-01', 2, 'Laquelle de ces actions l’arbitre doit-il faire en arrivant sur le court ?',

          '– S’assurer que le court est propre à la compétition.\n– Nettoyer les bancs des joueurs et jeter tous les papiers et bouteilles à la poubelle.\n– Vérifier qu’il ne reste pas de balles usagées du match précédent ou de l’entraînement qui traînent sur le court.\n– Placer les piquets de simple (sauf dans le cas d’un double).\n– Vérifier la hauteur du filet mais aussi l’état de la sangle et de l’attache.\n– S’assurer que les chaises des joueurs sont en place, ainsi que la chaise d’arbitre et celles des juges de ligne. Vérifier également l’état des chaises pour s’assurer qu’elles ne soient pas dangereuses.\n– S’assurer de l’approvisionnement en balles, boissons, serviettes, sciure de bois.\n– S’assurer que les juges de ligne et les ramasseurs sont présents.\n– Vérifier les balles.\n– Lorsqu’il a un microphone, l’arbitre vérifie son bon fonctionnement et s’il est muni d’un interrupteur marche/arrêt.\n– Vérifier le bon fonctionnement du tableau de score et sa remise à zéro.\n– Accueillir les joueurs.\n– S’assurer que seules les personnes autorisées sont présentes dans l’enceinte du court.\n– S’assurer que la tenue vestimentaire des joueurs ainsi que leur équipement sont conformes aux règlements applicables à l’épreuve (ne pas commencer l’échauffement si ces règles ne sont pas respectées).\n– Appeler les joueurs au niveau du filet pour la courte réunion d’avant-match, procéder au tirage au sort.\n– Monter sur la chaise et enclencher le chronomètre pour les 5 minutes d’échauffement.\n– Finir de préparer la feuille d’arbitrage.'],

        ['th-02', 22, 'La publicité sur les vêtements de tennis est-elle autorisée ?',

        ['th-02', 23, 'Un joueur a-t-il droit à une interruption de jeu pour remplacer ou réparer une partie de son équipement (sauf sa raquette) ? Si oui, combien de temps ?',

        ['th-02', 24, 'Un joueur porte des lunettes au début d’un match ; à la fin de la première manche, il commence à pleuvoir très légèrement sans que cela nécessite d’interrompre la partie. Le joueur demande alors une interruption de jeu pour mettre les lentilles de contact qu’il a dans son sac en remplacement de ses lunettes. Décision ?',

          'Vous pouvez autoriser le joueur à mettre ses lentilles ; il bénéficie d’un temps raisonnable pour le faire.'],

        ['th-02', 27, 'Un joueur a-t-il le droit de quitter le court pour aller chercher une raquette ? Dans quelles conditions ?',
