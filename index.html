          'L’arbitre annonce un let et procède immédiatement au changement de balles.'],
        ['th-13', 185, 'Le changement de balles est prévu à 9, puis 11 jeux. Les balles sont changées à 7/5 2-5. L’arbitre s’en aperçoit alors que le premier point du jeu suivant a été joué. Décision ?',
          ['On reprend le jeu en cours depuis le début avec les anciennes balles', 'Le jeu continue avec les balles neuves ; on les rechange au jeu d’après', 'On garde ces balles neuves jusqu’au prochain changement prévu', 'On rejoue le premier point avec les anciennes balles, puis on change'], 1,
          'Le jeu continue avec les balles neuves. Au jeu d’après, les balles seront changées à nouveau pour que le joueur (ou l’équipe) qui aurait dû servir avec des balles neuves profite effectivement de cet avantage.'],
        ['th-13', 186, 'Il a été décidé que les balles seraient changées après 9 jeux puis 11, mais le changement de balles a été oublié et effectué seulement après les 13 premiers jeux. Après combien de jeux le second changement de balles devra-t-il être effectué ?',
          ['11 jeux plus tard, soit après 24 jeux au total', '9 jeux plus tard, soit après 22 jeux au total', '7 jeux plus tard, pour revenir à 20 jeux au total', '11 jeux après le début, soit à 11 jeux au total'], 0,
          '11, soit après 24 jeux au total.'],
        ['th-13', 187, 'Quelle est l’influence de points de pénalité sur le changement de balles ?',
          ['Ils ne comptent pas pour le changement de balles', 'Aucune : on fait comme si les points avaient été joués', 'On retarde d’un jeu le changement de balles prévu', 'On avance d’un jeu le changement de balles prévu'], 1,
          'Aucune, on fait comme si les points avaient effectivement été joués.'],
        ['th-13', 188, 'Quelle est la règle à appliquer en cas de perte d’une ou de plusieurs balles ?',
          ['On remplace au changement de côté suivant (immédiatement s’il reste moins de 3 balles)', 'On remplace immédiatement chaque balle perdue par une balle neuve, quelle que soit l’usure', 'On continue sans remplacer les balles perdues jusqu’au prochain changement de balles', 'On remplace à la fin de la manche, en gardant d’ici là les balles qui restent'], 0,
          'On peut remplacer la (ou les) balle(s) perdue(s) au changement de côté suivant. On doit le faire immédiatement s’il reste moins de 3 balles. Les balles de remplacement doivent être de même usure que celles qui restent sur le court, ou neuves si les balles sur le court ont joué moins de 2 jeux (l’échauffement comptant pour 2 jeux).'],
        ['th-13', 189, 'Après une interruption de jeu, faut-il utiliser les balles du match pour le nouvel échauffement ?',
          ['Oui, toujours, pour que les joueurs retrouvent les mêmes sensations', 'Non, des balles neuves, remplacées ensuite par les balles du match', 'Oui, sauf si l’interruption a dépassé 15 minutes', 'Non, des balles d’usure identique, remplacées ensuite par celles du match'], 3,
          'Non, des balles d’usure identique doivent être utilisées pour l’échauffement, puis remplacées par les balles du match à la fin de l’échauffement.'],
        ['th-13', 190, 'La pluie interrompt la partie plus de 15 minutes au moment du changement de balles. Quelles balles doivent être utilisées pour l’échauffement ? Pour la reprise de la partie ?',
          ['Des balles neuves pour l’échauffement, puis d’autres balles neuves pour la reprise', 'Les balles du match pour l’échauffement et pour la reprise de la partie', 'Des balles usagées pour l’échauffement, puis les balles neuves pour la reprise', 'Des balles neuves pour l’échauffement, conservées ensuite pour la reprise'], 0,
          'Des balles neuves seront utilisées pour les 5 minutes d’échauffement. À la fin de l’échauffement, ces balles neuves seront remplacées par d’autres balles neuves pour la reprise de la partie.'],
        ['th-13', 191, 'Un arbitre n’a pas pu trouver de balles usagées dans le club au moment où il doit arbitrer sa partie qui se déroule sur un court sur lequel les joueurs perdent facilement des balles en cours de jeu. Que peut-il faire ?',
          ['Utiliser des balles neuves comme balles de remplacement pendant le match', 'Retarder le match jusqu’à ce que des balles usagées soient trouvées', 'Ajouter une balle à l’échauffement, puis la retirer avant le match', 'Jouer avec 2 balles seulement, pour en garder une en réserve'], 2,
          'L’arbitre a la possibilité d’ajouter une balle pendant l’échauffement qu’il retirera du jeu juste avant de commencer le match.'],
        ['th-14', 192, 'Quelles sont les étapes du Code de conduite pour un joueur ?',
          ['Avertissement, 1 point, 1 jeu de pénalité, puis disqualification', 'Avertissement, 1 point, 3 points de pénalité, puis disqualification', 'Avertissement, 1 point, 2 points de pénalité, puis disqualification', 'Avertissement, avertissement, puis disqualification par l’arbitre'], 1,
          'a) Joueur\n– 1re infraction : avertissement\n– 2e infraction : 1 point de pénalité\n– 3e infraction : 3 points de pénalité\n– 4e infraction : disqualification\nNota : La disqualification ne peut être prononcée que par le juge-arbitre (sur requête ou non de l’arbitre).\nb) Capitaine\nLors d’une rencontre par équipes, le capitaine ou son adjoint peuvent être sanctionnés pour tout comportement répréhensible. Ces sanctions ne peuvent être prononcées que par le juge-arbitre.\n– 1re infraction : avertissement\n– 2e infraction : avertissement\n– 3e infraction : disqualification (de la fonction de capitaine)'],
        ['th-14', 193, 'Si un joueur dépasse involontairement les 90 secondes ou les 120 secondes lors d’un changement de côté ou ne respecte pas la continuité du jeu, que doit faire l’arbitre ?',
          ['Avertissement à la première infraction, puis un point de pénalité à chaque infraction suivante', 'Appliquer le Code de conduite : avertissement, 1 point, 3 points de pénalité, puis disqualification', 'Appeler le juge-arbitre, seul habilité à sanctionner un dépassement de temps', 'Rien la première fois, puis un avertissement à chaque infraction suivante'], 0,
          'Appliquer la procédure de dépassement de temps non intentionnel, c’est-à-dire donner un avertissement à la première infraction, puis un point de pénalité à chaque infraction suivante.\nNota : Cette procédure est indépendante du Code de conduite.'],
        ['th-14', 194, 'Un joueur a déjà été pénalisé d’un avertissement et d’un point de pénalité pour dépassement de temps non intentionnel. Plus tard, visiblement fatigué, il prend trop de temps. Décision ?',
          ['Point de pénalité', '3 points de pénalité', 'Avertissement', 'Disqualification'], 0,
          'Point de pénalité.\nÉnervé par cette décision, il brise sa raquette sur le sol. Décision ? Avertissement (Code de conduite).'],
        ['th-14', 195, 'Le serveur mène 40-0 lorsque le relanceur, qui a déjà reçu un avertissement et un point de pénalité, jette sa raquette dans le grillage. Décision ?',
          ['3 points de pénalité : il perd le jeu et est mené 0-30 dans le jeu suivant', 'Un point de pénalité, qui donne le jeu au serveur ; le jeu suivant commence à 0-0', '3 points de pénalité : il perd le jeu, le point en trop étant perdu', 'Disqualification, prononcée immédiatement par l’arbitre de chaise'], 0,
          'Le relanceur est pénalisé de 3 points de pénalité : il perd donc le jeu, et est mené 0-30 dans le jeu suivant.'],
        ['th-14', 196, 'Qui peut disqualifier un joueur ?',
          ['L’arbitre de chaise, après la 3e infraction', 'Le superviseur de courts, sur toutes les parties', 'Le comité du tournoi, réuni pendant la partie', 'Le juge-arbitre, sur appel de l’arbitre de chaise'], 3,
          'Le juge-arbitre, sur appel de l’arbitre de chaise qui aura arrêté la partie s’il estime que le comportement d’un joueur peut justifier cette sanction.'],
        ['th-14', 197, 'Un joueur dont l’adversaire vient d’être pénalisé dans le cadre du Code de conduite peut-il demander l’annulation de cette pénalité ?',
          ['Oui', 'Oui, auprès du juge-arbitre', 'Oui, si l’arbitre l’accepte', 'Non'], 3,
          'Non.'],
        ['th-14', 198, 'Par qui le Code de conduite peut-il être appliqué ?',
          ['L’arbitre, le juge-arbitre (via l’arbitre) ou le superviseur en partie non arbitrée', 'Uniquement par le juge-arbitre, l’arbitre ne pouvant que lui signaler les infractions', 'Uniquement par l’arbitre de chaise, le juge-arbitre n’intervenant que pour disqualifier', 'Par l’arbitre de chaise et par les juges de ligne, chacun pour ce qu’il a constaté'], 0,
          'Par l’arbitre ou par le juge-arbitre qui peut demander à l’arbitre de le faire, ou par le superviseur de courts dans le cas d’une partie non arbitrée.'],
        ['th-14', 199, 'Laquelle de ces infractions engage l’application du Code de conduite ?',
          ['Doublé involontaire dans la raquette en cours d’échange', 'Coaching (conseils par geste ou par la parole)', 'Dépassement de temps non intentionnel au changement de côté', 'Appel au juge-arbitre sur un point de règlement'], 1,
          '– Jet de balle.\n– Jet de raquette (ou coup de raquette sur le filet, le sol, les grillages, etc.).\n– Grossièreté audible.\n– Geste obscène.\n– Insulte (envers l’arbitre, l’adversaire, un spectateur ou toute autre personne).\n– Dépassement de temps intentionnel (pour perte naturelle de condition physique, blessure, refus de reprendre la partie sur ordre de l’arbitre, etc.).\n– Coaching (conseils par geste ou par la parole de son entraîneur ou parent).\n– Agression physique.\n– Comportement antisportif (gêne volontaire de l’adversaire, soins non autorisés, sortie du court sans autorisation de l’arbitre ou du juge-arbitre, joueur qui ne donne pas le meilleur de lui-même pour gagner la partie, toute forme de comportement antisportif).'],
        ['th-14', 200, 'Un joueur ayant été pénalisé par l’arbitre en application du Code de conduite (avertissement ou point de pénalité) peut-il faire appel au juge-arbitre ?',
          ['Non, c’est une question de fait laissée à l’arbitre', 'Non, une sanction de l’arbitre est toujours définitive', 'Oui, puisqu’il s’agit d’un point de règlement', 'Oui, mais uniquement contre une disqualification'], 2,
          'Oui, puisqu’il s’agit d’un point de règlement.\nLe jeu doit-il être interrompu en attendant le juge-arbitre ?\n– Non, lorsqu’il s’agit d’un avertissement qui n’a pas d’influence sur le score.\n– Oui, pour les autres étapes du Code de conduite qui influent directement sur le score.'],
        ['th-14', 201, 'Le juge-arbitre peut-il, sur appel d’un joueur, annuler une sanction infligée par l’arbitre de chaise dans le cadre du Code de conduite ?',
          ['Non, l’arbitre de chaise est seul responsable du Code', 'Oui, puisqu’il s’agit d’un point de règlement', 'Oui, mais seulement s’il s’agit d’un avertissement', 'Non, puisqu’il s’agit d’une question de fait'], 1,
          'Oui, puisqu’il s’agit d’un point de règlement.'],
        ['th-14', 202, 'En cours d’échange, un joueur monte au filet. Son adversaire le vise délibérément. Que doit faire l’arbitre ?',
          ['Rien, cela fait partie du jeu', 'Avertissement pour comportement antisportif', 'Point de pénalité pour agression physique', 'Let et rappel à l’ordre du joueur'], 0,
          'Rien, cela fait partie du jeu.'],
        ['th-14', 203, 'En effectuant un smash, un joueur blesse son adversaire qui ne peut reprendre la partie. Décision ?',
          ['Le joueur qui a smashé est disqualifié pour agression', 'Le joueur qui a smashé gagne la partie (abandon)', 'La partie est arrêtée et rejouée un autre jour', 'Le joueur blessé gagne la partie par disqualification'], 1,
          'Le joueur qui a smashé a gagné la partie (abandon).'],
        ['th-14', 204, 'En effectuant un smash, un joueur laisse involontairement échapper sa raquette qui va frapper son adversaire. Celui-ci blessé, ne peut reprendre la partie. Décision ?',
          ['Le joueur qui a lâché sa raquette est disqualifié', 'Le joueur qui a lâché sa raquette perd le point, puis la partie', 'La partie est suspendue et reprendra un autre jour', 'Le joueur blessé perd la partie par abandon'], 3,
          'Le joueur blessé a perdu la partie par abandon.'],
        ['th-14', 205, 'Entre 2 points, un joueur énervé envoie violemment une balle du côté de son adversaire qui, ne l’ayant pas vue venir, est blessé par la balle et ne peut reprendre la partie. Décision ?',
          ['Avertissement, puis la partie est perdue par abandon', 'Le blessé perd la partie par abandon', '3 points de pénalité pour jet de balle', 'Le joueur est immédiatement disqualifié'], 3,
          'Le joueur qui a blessé son adversaire en dehors d’une action de jeu est immédiatement disqualifié.'],
        ['th-14', 206, 'Dans quels cas un joueur peut-il recevoir des conseils ?',
          ['Jamais : les conseils sont interdits pendant toute la durée de la partie, quel que soit le format', 'À chaque changement de côté, par son entraîneur, s’il reste derrière le grillage', 'En équipes aux changements de côté (capitaine), ou s’il est sorti du court lors d’une interruption', 'Pendant ses sorties aux toilettes, l’arbitre ne pouvant pas le suivre'], 2,
          '– En rencontres par équipes, lors des changements de côté, par le capitaine ou son adjoint présent sur le court.\n– En cas d’interruption de la partie, si le joueur est sorti du court (sauf pour une sortie aux toilettes).'],
        ['th-14', 207, 'Un joueur reçoit des conseils de façon illicite, par gestes ou par la parole. Que doit faire l’arbitre ?',
          ['Faire sortir l’entraîneur et faire rejouer le point', 'Appliquer le Code de conduite pour coaching', 'Rien, tant que les conseils ne gênent pas l’adversaire', 'Donner point perdu au joueur, hors Code de conduite'], 1,
          'Appliquer le Code de conduite pour coaching.'],
        ['th-14', 208, 'Au moment où le joueur va faire un smash, son adversaire agite les bras pour le gêner. Que doit faire l’arbitre ?',
          ['Annoncer un let et prévenir le joueur qu’il perdra le point la prochaine fois', 'Attendre le résultat du smash, puis donner le point au joueur gêné s’il le rate', 'Donner un avertissement du Code de conduite, sans toucher au score', 'Donner instantanément point perdu au joueur fautif, avant même le smash'], 3,
          'Donner instantanément point perdu au joueur fautif, avant même que le smash ne soit effectué. Si cela se reproduit, l’arbitre peut appliquer le Code de conduite pour comportement antisportif.'],
        ['th-14', 209, 'Un joueur qui n’a pas encore reçu d’avertissement injurie gravement l’arbitre. Que doit faire celui-ci ?',
          ['Arrêter le jeu et appeler le juge-arbitre : c’est un cas de disqualification', 'Donner un avertissement, première étape du Code de conduite', 'Donner directement un point de pénalité pour insulte', 'Disqualifier lui-même le joueur pour insulte grave envers l’arbitre'], 0,
          'Il doit immédiatement arrêter le jeu et appeler le juge-arbitre sur le court car il s’agit d’un cas de disqualification. Le juge-arbitre décidera de la sanction à infliger au joueur.'],
        ['th-14', 210, 'Le serveur vient de gagner le premier point du jeu lorsque son adversaire se voit infliger un point de pénalité. À 30-0, de quel côté le serveur doit-il servir ?',
          ['À gauche, puisque c’est le deuxième point joué', 'Au choix du serveur, la pénalité ayant décalé le score', 'À droite (toujours en conformité avec le score)', 'À gauche, comme pour un troisième point'], 2,
          'À droite (toujours en conformité avec le score).'],
        ['th-14', 211, 'Un joueur qui a déjà reçu un avertissement, puis un point de pénalité dans le cadre de l’application du Code de conduite, ne respecte pas la règle de continuité du jeu car il souffre de crampes. Décision ?',
          ['Le Code de conduite s’applique : 3 points de pénalité', 'Dépassement de temps non intentionnel : avertissement', 'Interruption de 3 minutes pour soigner ses crampes', 'Disqualification, la 3e infraction étant la dernière'], 0,
          'Le Code de conduite s’applique à nouveau : 3 points de pénalité.'],
        ['th-14', 212, 'En double, un joueur qui jusqu’alors s’était très bien tenu jette violemment sa raquette dans les grillages. Son partenaire, lui, a déjà reçu un avertissement. Quelle est la sanction qui doit être prise ?',
          ['Un avertissement, puisque c’est sa première infraction', '3 points de pénalité, l’équipe ayant cumulé 2 infractions', 'Un point de pénalité : en double, le Code s’applique à l’équipe', 'Un avertissement au joueur et un point à son partenaire'], 2,
          'Un point de pénalité, car en double le Code de conduite est appliqué à l’équipe.'],
        ['th-14', 213, 'Un joueur insulte l’arbitre pendant l’échauffement. Peut-il être sanctionné dans le cadre du Code de conduite ?',
          ['Non, le Code ne s’applique qu’à partir du premier service', 'Oui, mais seulement par le juge-arbitre avant la partie', 'Oui, le Code s’applique dès l’entrée des joueurs sur le court', 'Non, l’arbitre rapporte seulement les faits au juge-arbitre'], 2,
          'Oui, le Code de conduite est applicable dès l’entrée des joueurs sur le court.'],
        ['th-14', 214, 'Que doit faire un juge de ligne injurié par un joueur ou témoin d’une violation du Code de conduite que l’arbitre n’a pas remarquée (gestes grossiers, conseils, etc.) ?',
          ['Sanctionner lui-même le joueur par un avertissement du Code de conduite', 'À la fin de l’échange, aller rapporter les faits à l’arbitre de chaise', 'Se lever immédiatement et arrêter le point pour prévenir l’arbitre', 'Ne rien dire pendant la partie et prévenir le juge-arbitre après le match'], 1,
          'Se lever, à la fin de l’échange, et aller rapporter les faits à l’arbitre de chaise qui pourra (sans y être obligé) sanctionner le joueur fautif.'],
        ['th-14', 215, 'Au cours d’un tournoi, un joueur insulte l’arbitre de chaise ou un juge de ligne après l’annonce « jeu, set et match ». Décision ?',
          ['L’arbitre disqualifie le joueur, même si la partie est terminée', 'Le Code ne s’applique plus : l’arbitre rapporte les faits au juge-arbitre', 'L’arbitre donne un avertissement du Code de conduite au joueur', 'Le résultat du match est annulé par l’arbitre de chaise'], 1,
          'La partie étant terminée, le Code de conduite n’est plus applicable. L’arbitre doit rapporter les faits au juge-arbitre dès la fin de sa partie. (Si le joueur a gagné, la disqualification peut être prononcée par le comité du tournoi et le juge-arbitre peut établir une fiche de pénalité.)'],
        ['th-15', 216, 'Un joueur frappe une balle avec le manche de sa raquette. Est-ce une faute ?',
          ['Oui', 'Non', 'Oui, sauf au service', 'Seulement en double'], 1,
          'Non.'],
        ['th-15', 217, 'Un joueur frappe une balle avec le manche de sa raquette et son pouce. Est-ce une faute ?',
          ['Non', 'Oui', 'Non, si c’est involontaire', 'Seulement sur un smash'], 1,
          'Oui.'],
        ['th-15', 218, 'En cours d’échange, une balle tombe de la poche d’un joueur. Décision ?',
          ['Point perdu pour le joueur dès la première fois', 'Let à chaque fois, la gêne étant involontaire', 'Rien, le jeu continue tant que la balle reste immobile', 'La première fois let, puis point perdu les fois suivantes'], 3,
          '– La première fois, l’arbitre annonce un let et préviendra le joueur qu’il perdra le point les fois suivantes.\n– La deuxième fois et les fois suivantes, le joueur perd le point.\nNota : Cette règle s’applique si le joueur fait tomber sa casquette, son bandana ou tout objet lui appartenant alors que le point continue.'],
        ['th-15', 219, 'En court couvert, une balle touche le plafond. Décision ?',
          ['Let, point rejoué', 'La balle est bonne', 'Bonne si elle retombe dans le court', 'La balle est faute'], 3,
          'La balle est faute.'],
        ['th-15', 220, 'En cours d’échange, une balle frappée par A vient heurter une balle restée au sol, qui s’y trouvait déjà avant le début de l’échange, du côté de B. Décision ?',
          ['Si B renvoie la balle qui était en jeu, A gagne le point', 'Si B ne peut renvoyer aucune des 2 balles, un let est annoncé', 'Si B renvoie la mauvaise balle, A gagne le point', 'Si B renvoie l’une des 2 balles sans que l’arbitre sache laquelle, B gagne le point'], 2,
          'Quatre cas sont possibles :\n• B ne peut renvoyer aucune des 2 balles, A gagne le point ;\n• B parvient à renvoyer la balle en jeu, l’échange se poursuit ;\n• B renvoie l’une des 2 balles, mais si l’arbitre n’est pas sûr que ce soit la balle qui était en jeu, un let doit être annoncé ;\n• B renvoie la mauvaise balle, A gagne le point.'],
        ['th-15', 221, 'En effectuant un smash gagnant, un joueur laisse échapper sa raquette qui tombe dans le court de son adversaire. Décision ?',
          ['Il gagne le point dans tous les cas, puisque son smash était gagnant', 'Il perd le point dès que sa raquette passe au-dessus du filet', 'Let, la raquette ayant pu gêner son adversaire', 'S’il touche le court adverse avant que le point soit gagné, il perd le point'], 3,
          '– Si la raquette touche le court du côté de son adversaire avant que le point n’ait été gagné, le joueur qui a smashé perd le point.\n– Si c’est après que le point a été gagné (balle dans les grillages ou deuxième rebond), le joueur qui a smashé marque le point.\nNota : Seul compte l’instant où la raquette touche le sol, et non l’instant où elle passe au-dessus du filet.'],
        ['th-15', 222, 'La pastille antivibration du joueur A roule et touche le filet ou s’arrête dans le court de l’adversaire pendant que la balle est en jeu. Décision ?',
          ['Let, la pastille étant un objet étranger qui a gêné le jeu', 'Rien, l’échange continue : la pastille n’est pas un joueur', 'L’adversaire perd le point, la pastille étant dans son camp', 'A perd le point : la pastille fait partie de son équipement'], 3,
          'Le joueur A perd le point car la pastille fait partie de son équipement.'],
        ['th-15', 223, 'À la fin du point, le perdant trouve la pastille antivibration de son adversaire dans sa moitié de court et réclame le point. Décision ?',
          ['Le point reste acquis', 'Le point est rejoué', 'Le point est donné au perdant', 'Le juge-arbitre est appelé'], 0,
          'Le point reste acquis. L’arbitre de chaise n’ayant pas vu la pastille rouler dans la moitié du court adverse pendant le point, il ne peut pas déterminer à quel moment l’invasion a eu lieu.'],
        ['th-15', 224, 'Avant le début d’un échange, un joueur peut-il demander à son adversaire d’écarter une balle sur le court de son côté du filet ou coincée dans une des mailles du filet ?',
          ['Non, chacun s’occupe des balles de son côté', 'Oui, et l’adversaire est obligé de l’enlever', 'Oui, mais l’adversaire n’est pas obligé de l’enlever', 'Oui, mais seulement avant un service'], 2,
          'Oui, mais le joueur n’est pas obligé de l’enlever.'],
        ['th-15', 225, 'Une première balle de service reste coincée dans une des mailles du filet. Le serveur peut-il servir sa seconde balle sans la retirer ?',
          ['Non, il doit la retirer', 'Oui', 'Oui, si le relanceur accepte', 'Non, sauf si elle dépasse'], 1,
          'Oui.'],
        ['th-15', 226, 'A sert une première balle de service qui tombe dans le filet. Celle-ci se coince dans une des mailles du filet. A sert sa seconde balle sans retirer la première et au cours de l’échange qui suit, une balle « net » fait tomber la balle coincée dans le filet qui roule légèrement dans le court de A. Décision ?',
          ['L’arbitre peut annoncer un let, sauf si cela lèse un joueur ou si la balle n’est plus en jeu', 'A perd le point, puisqu’il a choisi de servir sans retirer la balle coincée dans le filet', 'L’échange continue dans tous les cas, puisque A a accepté de jouer avec la balle dans le filet', 'Let dans tous les cas, la balle tombée du filet étant un élément perturbateur'], 0,
          'L’arbitre peut annoncer un let, sauf si cette décision lèse manifestement l’un des joueurs ou si la balle n’est déjà plus en jeu.'],
        ['th-15', 227, 'Une balle dégonflée doit-elle être assimilée à une balle crevée ?',
          ['Non, jamais : une balle dégonflée reste en jeu jusqu’au prochain changement de balles', 'Oui, si elle n’est plus utilisable ; mais seule une balle crevée fait rejouer le point', 'Oui, et dans les 2 cas le point joué avec cette balle est rejoué', 'Oui, et dans les 2 cas le point joué avec cette balle reste acquis'], 1,
          'Oui, dans la mesure où l’arbitre estime que cette balle n’est plus utilisable pour la suite de la partie et doit être remplacée. Deux cas se présentent :\n• si la balle est crevée (surface très endommagée ou sans pression) : le point est à rejouer ;\n• si la balle est dégonflée (pression faible) : le point reste acquis.\nNota : Une balle mouillée est dans tous les cas assimilée à une balle dégonflée, c’est-à-dire que le point joué reste acquis et on remplace la balle.'],
        ['th-15', 228, 'En cours d’échange, un joueur arrête le point en attrapant la balle avec la main, disant que celle-ci est crevée. L’arbitre juge que la balle est dégonflée. Décision ?',
          ['Let, le point est rejoué', 'Point rejoué avec une balle neuve', 'L’adversaire perd le point', 'Le joueur perd le point'], 3,
          'Le joueur perd le point. Le point n’est à rejouer que lorsque la balle est crevée et non simplement dégonflée.'],
        ['th-15', 229, 'En fin d’échange, le relanceur ramasse la balle avec laquelle s’est joué l’échange qu’il a perdu. Il la remet à l’arbitre et lui montre qu’elle vient d’un court voisin et qu’elle n’est pas de la même marque que les balles utilisées pour son match. Décision ?',
          ['On rejoue le point avec une balle du match', 'Le relanceur gagne le point, la balle n’étant pas réglementaire', 'Le point est acquis ; l’arbitre retire la balle du jeu', 'On rejoue tout le jeu avec les balles du match'], 2,
          'Le point normalement joué est acquis. L’arbitre retire la balle du jeu.'],
        ['th-15', 230, 'À la volée, un joueur jette sa raquette vers la balle qui tombe bonne. Décision ?',
          ['Le coup est bon, l’échange continue', 'Let, le point est rejoué', 'Le joueur gagne le point', 'Le joueur qui a lancé sa raquette perd le point'], 3,
          'Le joueur qui a joué la balle en n’ayant plus la raquette en main perd le point.'],
        ['th-15', 231, 'Un piquet de simple tombe en cours d’échange. Décision ?',
          ['L’échange continue toujours, le piquet n’étant pas le filet', 'Le joueur dont la balle a fait tomber le piquet perd le point', 'On rejoue tout le jeu après avoir remis le piquet en place', 'En général let, sauf si l’arbitre l’estime inopportun'], 3,
          'En règle générale, il y a lieu d’annoncer un let, sauf si l’arbitre estime une telle décision inopportune (par exemple, dans le cas où un joueur n’a aucune chance de renvoyer la balle).'],
        ['th-15', 232, 'En simple, en cours d’échange, en dehors d’un service, une balle heurte un poteau du filet et tombe bonne. Décision ?',
          ['La balle est bonne dans tous les cas, l’échange continue', 'La balle est faute dans tous les cas, le poteau ne faisant pas partie du filet', 'Let dans tous les cas, le point est rejoué', 'Poteau de double : faute ; piquet de simple : l’échange continue'], 3,
          '– Si c’est un poteau de double, c’est une faute.\n– Si c’est un piquet de simple, l’échange se poursuit.'],
        ['th-15', 233, 'Un terrain est dépourvu de piquets de simple, alors qu’une partie de simple doit avoir lieu. Après s’être assuré auprès du club qu’aucun piquet n’est disponible, l’arbitre doit-il démarrer la partie ?',

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function loadStore() {
      try {
        const data = JSON.parse(localStorage.getItem(STORE_KEY));
        if (data && Array.isArray(data.quiz_sessions) && Array.isArray(data.answers)) return data;
      } catch (e) { /* stockage illisible : on repart de zéro */ }
      return { quiz_sessions: [], answers: [] };
    }

    function saveSeries() {
      if (series.saved) return;
      series.saved = true;
      const store = loadStore();
      const session = {
        id: newId(),
        mode: 'theme',
        theme_id: series.theme.id,
        status: 'completed',
        question_ids: series.questions.map(q => q.id),
        started_at: series.started_at,
        completed_at: new Date().toISOString(),
        score: series.answers.filter(a => a.result === 'correct').length,
        max_score: series.questions.length
      };
      store.quiz_sessions.push(session);
      series.questions.forEach((q, i) => {
        store.answers.push({ id: newId(), quiz_session_id: session.id, question_id: q.id, ...series.answers[i] });
      });
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(store));
      } catch (e) { /* écriture impossible : la série se termine quand même */ }
    }

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function show(name, focusTarget) {
      Object.entries(screens).forEach(([key, node]) => {
        node.hidden = key !== name;
        node.classList.remove('is-entering');
      });
      void screens[name].offsetWidth;
      screens[name].classList.add('is-entering');
      window.scrollTo(0, 0);
      if (focusTarget) focusTarget.focus({ preventScroll: true });
    }

        const card = el('button', 'theme-card');
        card.type = 'button';
        card.dataset.themeId = theme.id;
        const body = el('span');
        body.append(
          el('span', 'theme-name', theme.name),
          el('span', 'theme-desc', theme.description),
          el('span', 'theme-count', `${count} questions`)
        );
        card.append(themeIcon(theme), body, el('span', 'theme-arrow', '›'));
        card.lastChild.setAttribute('aria-hidden', 'true');
        card.addEventListener('click', () => startSeries(theme, card.firstChild));
        item.append(card);
        list.append(item);
      });
    }

    function startSeries(theme, origin) {
      if (serving) return;
      const pool = BANK.questions.filter(q => q.theme_id === theme.id);
      series = {
        theme, questions: shuffle(pool).slice(0, SERIES_LENGTH), index: 0, answers: [], answered: false,
        started_at: new Date().toISOString(), saved: false
      };
      $('quiz-theme').textContent = theme.name;
      $('progress-track').setAttribute('aria-valuemax', String(series.questions.length));
      playServe(theme, origin, () => {
        renderQuestion();
        show('quiz', $('question-statement'));
      });
    }

    // Lancement d'un thème : la balle part de l'élément touché, traverse l'écran, rebondit puis grandit
    // jusqu'à le couvrir avec le nom du thème. reveal() affiche la série sous la balle avant qu'elle
    // s'efface. Un appui ou une touche passe l'animation.
    function playServe(theme, origin, reveal) {
      if (reduceMotion.matches || !Element.prototype.animate) {
        reveal();
        return;
      }
      serving = true;
      const overlay = $('serve');
      const ball = $('serve-ball');
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const size = Math.ceil(Math.hypot(vw, vh) * 1.08);
      const rect = origin ? origin.getBoundingClientRect() : null;
      const startSize = rect ? Math.max(24, Math.min(rect.width, rect.height, 48)) : 40;
      const s0 = startSize / size;
      const sx = rect ? rect.left + rect.width / 2 : vw / 2;
      const sy = rect ? rect.top + rect.height / 2 : vh;
      const cx = vw / 2;
      const cy = vh / 2;
      const apexY = Math.max(startSize, Math.min(sy, cy) - vh * 0.28);
      const at = (x, y, scaleX, scaleY = scaleX) =>
        `translate(${x - size / 2}px, ${y - size / 2}px) scale(${scaleX}, ${scaleY})`;

      const T = { travel: 640, grow: 420, hold: 720, out: 340 };
      const total = T.travel + T.grow + T.hold + T.out;
      const o = ms => ms / total;

      $('serve-icon').innerHTML = iconSvg(theme);
      $('serve-kicker').textContent = theme.id === 'th-vf' ? 'À la volée' : `Thème ${theme.position}`;
      $('serve-name').textContent = theme.name;
      $('serve-call').textContent = `${series.questions.length} questions · Jouez !`;
      ball.style.width = ball.style.height = `${size}px`;
      ball.style.setProperty('--seam', `${size * 0.045}px`);
      overlay.hidden = false;

      const anims = [
        ball.animate([
          { offset: 0, transform: at(sx, sy, s0), easing: 'cubic-bezier(.2, .6, .4, 1)' },
          { offset: o(T.travel * 0.45), transform: at((sx + cx) / 2, apexY, s0 * 1.2), easing: 'cubic-bezier(.6, 0, .9, .5)' },
          { offset: o(T.travel * 0.9), transform: at(cx, vh * 0.7, s0 * 1.4, s0 * 1.05), easing: 'linear' },
          { offset: o(T.travel), transform: at(cx, vh * 0.66, s0 * 1.3), easing: 'cubic-bezier(.5, 0, .2, 1)' },
          { offset: o(T.travel + T.grow), transform: at(cx, cy, 1) },
          { offset: o(T.travel + T.grow + T.hold), transform: at(cx, cy, 1), easing: 'ease-in' },
          { offset: 1, transform: at(cx, cy, 1.25) }
        ], { duration: total, fill: 'both' }),
        $('serve-seams').animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-780deg)' }],
          { duration: T.travel + T.grow, easing: 'cubic-bezier(.25, .6, .35, 1)', fill: 'both' }),
        overlay.animate([{ backgroundColor: 'rgba(28, 36, 32, 0)' }, { backgroundColor: 'rgba(28, 36, 32, .35)' }],
          { duration: T.travel, fill: 'both' }),
        $('serve-card').animate([{ opacity: 0, transform: 'translateY(14px) scale(.96)' }, { opacity: 1, transform: 'none' }],
          { delay: T.travel + T.grow - 120, duration: 360, easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'both' }),
        overlay.animate([{ opacity: 1 }, { opacity: 0 }],
          { delay: total - T.out, duration: T.out, easing: 'ease-in', fill: 'both' })
      ];

      let revealed = false;
      const doReveal = () => {
        if (revealed) return;
        revealed = true;
        reveal();
      };
      const timer = setTimeout(doReveal, T.travel + T.grow);
      const skip = () => {
        clearTimeout(timer);
        doReveal();
        anims.forEach(a => a.finish());
      };
      overlay.addEventListener('click', skip);
      document.addEventListener('keydown', skip);
      Promise.all(anims.map(a => a.finished)).then(() => {
        overlay.removeEventListener('click', skip);
        document.removeEventListener('keydown', skip);
        overlay.hidden = true;
        anims.forEach(a => a.cancel());
        serving = false;
      });
    }

    function renderQuestion() {
      const q = series.questions[series.index];
      const n = series.index + 1;
      const total = series.questions.length;
      series.answered = false;

      $('progress-label').textContent = `Question ${n} / ${total}`;
      $('progress-track').setAttribute('aria-valuenow', String(n));
      $('progress-fill').style.width = `${(n / total) * 100}%`;
      $('question-statement').textContent = q.statement;

      const list = $('choices');
      list.replaceChildren();
      [...q.choices].sort((a, b) => a.position - b.position).forEach((choice, i) => {
        const item = el('li');
        const btn = el('button', 'choice');
        btn.type = 'button';
        btn.dataset.choiceId = choice.id;
        const letter = el('span', 'choice-letter', LETTERS[i]);
        letter.setAttribute('aria-hidden', 'true');
        const label = el('span', 'choice-label');
        label.append(el('span', 'sr-only', `${LETTERS[i]} : `), document.createTextNode(choice.label));
        const mark = el('span', 'choice-mark');
        mark.setAttribute('aria-hidden', 'true');
        btn.append(letter, label, mark);
        btn.addEventListener('click', () => answer(choice.id));
        item.append(btn);
        list.append(item);
      });

      $('feedback').hidden = true;
      const next = $('next-btn');
      next.disabled = true;
      next.textContent = n === total ? 'Voir mon score' : 'Question suivante';
      $('action-bar').classList.add('is-hidden');
    }

    function answer(choiceId) {
      if (series.answered) return;
      series.answered = true;
      const q = series.questions[series.index];
      const picked = q.choices.find(c => c.id === choiceId);
      const ok = picked.is_correct;
      series.answers.push({ choice_id: choiceId, result: ok ? 'correct' : 'wrong', answered_at: new Date().toISOString() });

      $('choices').querySelectorAll('.choice').forEach(btn => {
        const choice = q.choices.find(c => c.id === btn.dataset.choiceId);
        const mark = btn.querySelector('.choice-mark');
        btn.disabled = true;
        if (choice.is_correct) {
          btn.classList.add('is-correct');
          mark.textContent = '✓';
          btn.querySelector('.choice-label').append(el('span', 'sr-only', choice.id === choiceId ? ' (ta réponse, juste)' : ' (bonne réponse)'));
        } else if (choice.id === choiceId) {
          btn.classList.add('is-wrong');
          mark.textContent = '✕';
          btn.querySelector('.choice-label').append(el('span', 'sr-only', ' (ta réponse, fausse)'));
        } else {
          btn.classList.add('is-dimmed');
        }
      });

      const feedback = $('feedback');
      feedback.classList.toggle('is-wrong', !ok);
      $('feedback-icon').textContent = ok ? '✓' : '✕';
      $('feedback-title').textContent = ok ? 'Bonne réponse' : 'Mauvaise réponse';
      $('feedback-text').textContent = q.explanation;
      $('feedback-ref').textContent = q.rule_reference;
      feedback.hidden = false;

      const next = $('next-btn');
      next.disabled = false;
      $('action-bar').classList.remove('is-hidden');
      next.focus({ preventScroll: true });
    }

    function nextQuestion() {
      if (!series.answered) return;
      if (series.index + 1 >= series.questions.length) {
        const before = computeGame();
        saveSeries();
        renderScore(before);
        return;
      }
      series.index++;
      renderQuestion();
      show('quiz', $('question-statement'));
    }

    function renderScore(before) {
      const total = series.questions.length;
      const score = series.answers.filter(a => a.result === 'correct').length;
      $('score-theme').textContent = series.theme.name;
      const title = $('score-title');
      const value = document.createTextNode(`${score} `);
      title.replaceChildren(value, el('small', '', `/ ${total}`));
      if (!reduceMotion.matches && score > 0) {
        // Le score défile de 0 à sa valeur pendant que la balle tombe
        const start = performance.now() + 200;
        const tick = now => {
          const p = Math.max(0, Math.min(1, (now - start) / 700));
          value.data = `${Math.round(score * (1 - Math.pow(1 - p, 3)))} `;
          if (p < 1) requestAnimationFrame(tick);
        };
        value.data = '0 ';
        requestAnimationFrame(tick);
      }
      title.setAttribute('aria-label', `Score : ${score} sur ${total}`);
      $('score-message').textContent = score / total >= 0.8
        ? 'Excellent ! Tu maîtrises ce thème, garde ce niveau jusqu’à l’examen.'
        : score / total >= 0.5
          ? 'Tu es sur la bonne voie : relis les explications et refais une série.'
          : 'Continue de t’entraîner : chaque série te rapproche de l’examen.';

      const recap = $('recap');
      recap.replaceChildren();
      series.questions.forEach((q, i) => {
        const ok = series.answers[i].result === 'correct';
        const item = el('li', ok ? 'recap-item' : 'recap-item is-wrong');
        const mark = el('span', 'recap-mark', ok ? '✓' : '✕');
        mark.setAttribute('aria-hidden', 'true');
        const body = el('span');
        body.append(el('span', 'recap-status', `${i + 1}. ${ok ? 'Juste' : 'Faux'}`), document.createTextNode(q.statement));
        item.append(mark, body);
        recap.append(item);
      });
      renderGains(before);
      show('score', title);
    }

    function rateClass(rate) {
      return rate >= 80 ? 'is-high' : rate >= 50 ? '' : 'is-low';
    }

    function plural(n, word) {
      return `${n} ${word}${n > 1 ? 's' : ''}`;
    }

    function shortDate(iso) {
      return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }

    // Pictogrammes des thèmes (tracés 24 × 24) ; la tuile prend tour à tour la surface terre battue, gazon ou dur
    const THEME_ICONS = {
      'th-01': '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM8.5 11h7M8.5 14.5h7M8.5 18h4"/>',
      'th-02': '<ellipse cx="14.5" cy="9.5" rx="5.5" ry="7" transform="rotate(45 14.5 9.5)"/><path d="M10.4 13.6 4 20M11 13l7.4-7.4M11.3 6.3l6.4 6.4"/>',
      'th-03': '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 2.5h4M12 2.5V6M18.5 6.5 20 5"/>',
      'th-04': '<circle cx="15" cy="12" r="6"/><path d="M11 7.8c1.6 2.4 1.6 6 0 8.4M19 7.8c-1.6 2.4-1.6 6 0 8.4M2 9h4M3 12h3.5M2 15h4"/>',
      'th-05': '<path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/>',
      'th-06': '<path d="M3 7h18M4 7v13M20 7v13"/><path d="M8 7v13M12 7v13M16 7v13M4 11.5h16M4 16h16" stroke-width="1.2"/>',
      'th-07': '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><text x="12" y="15.6" text-anchor="middle" font-size="8.5" font-weight="800" fill="currentColor" stroke="none" font-family="system-ui, sans-serif">7-6</text>',
      'th-08': '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><text x="12" y="15.6" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" stroke="none" font-family="system-ui, sans-serif">10</text>',
      'th-09': '<path d="M7 15a4 4 0 0 1 .5-8 5.5 5.5 0 0 1 10.3 1.6A3.3 3.3 0 0 1 17 15z"/><path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/>',
      'th-10': '<path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/>',
      'th-11': '<path d="M4 5h16v11H10l-4 3.5V16H4z"/><path d="M12 8v4M12 14.3v.1"/>',
      'th-12': '<circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M3.5 19c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5M15 13.6c3 0 5.5 1.9 5.5 5"/>',
      'th-13': '<rect x="7" y="6" width="10" height="15" rx="2"/><path d="M7 10h10M8.5 3h7"/><circle cx="12" cy="15.5" r="2.6"/>',
      'th-14': '<rect x="4" y="5" width="9" height="13" rx="1.5"/><rect x="11" y="6.5" width="9" height="13" rx="1.5" transform="rotate(10 15.5 13)"/>',
      'th-15': '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6v.6M12 17v.1"/>',
      'th-16': '<path d="M8 4h8v6H8zM9 10 7 20M15 10l2 10M7.6 16h8.8M4 4l16 16"/>',
      'th-vf': '<path d="M3 12.5l3 3 5.5-6.5M14 8l6 7M20 8l-6 7"/>'
    };
    const SURFACES = ['clay', 'grass', 'hard'];

    function iconSvg(theme) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${THEME_ICONS[theme.id] || ''}</svg>`;
    }

    function themeIcon(theme) {
      const tile = el('span', `theme-icon is-${SURFACES[(theme.position - 1) % SURFACES.length]}`);
      tile.setAttribute('aria-hidden', 'true');
      tile.innerHTML = iconSvg(theme);
      tile.append(el('span', 'theme-num', themeNum(theme)));
      return tile;
    }

    function themeNum(theme) {
      return theme.id === 'th-vf' ? 'VF' : String(theme.position);
    }

    // Statistiques recalculées depuis le stockage : les lignes dont le thème ou la question
    // n'existe plus dans BANK sont ignorées.
    function computeStats() {
      const store = loadStore();
      const themesById = new Map(BANK.themes.map(t => [t.id, t]));
      const questionsById = new Map(BANK.questions.map(q => [q.id, q]));
      const sessions = store.quiz_sessions
        .filter(s => s && s.status === 'completed' && themesById.has(s.theme_id)
          && typeof s.completed_at === 'string' && s.max_score > 0)
        .sort((a, b) => (a.completed_at < b.completed_at ? -1 : a.completed_at > b.completed_at ? 1 : 0));
      const sessionIds = new Set(sessions.map(s => s.id));
      const answers = store.answers.filter(a => a && sessionIds.has(a.quiz_session_id) && questionsById.has(a.question_id));

      const byTheme = new Map(BANK.themes.map(t => [t.id, { theme: t, series: [], total: 0, correct: 0 }]));
      sessions.forEach(s => byTheme.get(s.theme_id).series.push(s));
      answers.forEach(a => {
        const entry = byTheme.get(questionsById.get(a.question_id).theme_id);
        entry.total++;
        if (a.result === 'correct') entry.correct++;
      });
      byTheme.forEach(entry => {
        entry.rate = entry.total ? Math.round((entry.correct / entry.total) * 100) : null;
      });

      return {
        sessions,
        answers,
        correct: answers.filter(a => a.result === 'correct').length,
        themes: [...byTheme.values()].sort((a, b) => a.theme.position - b.theme.position),
        themesById
      };
    }

    function statsSection(title) {
      const section = el('section', 'stats-section');
      section.append(el('h2', 'section-title', title));
      return section;
    }

    function renderStats() {
      const stats = computeStats();
      const body = $('stats-body');
      body.replaceChildren();

      if (!stats.sessions.length) {
        const empty = el('div', 'stats-empty');
        const icon = el('span', 'stats-empty-icon', '0');
        icon.setAttribute('aria-hidden', 'true');
        const btn = el('button', 'btn btn-primary btn-block', 'Choisir un thème');
        btn.type = 'button';
        btn.addEventListener('click', goHome);
        empty.append(icon, el('p', '', 'Aucune série pour l’instant. Termine une série de 10 questions pour voir ta progression ici.'), btn);
        body.append(empty);
        show('stats', $('stats-title'));
        return;
      }

      // Résumé
      const summary = el('dl', 'stats-summary');
      const rate = Math.round((stats.correct / Math.max(1, stats.answers.length)) * 100);
      [['Séries', String(stats.sessions.length)], ['Questions', String(stats.answers.length)], ['Réussite', `${rate} %`]]
        .forEach(([label, value]) => {
          const item = el('div', 'stat');
          item.append(el('dt', '', label), el('dd', '', value));
          summary.append(item);
        });
      body.append(summary);

      // Badges
      const game = computeGame();
      const badgeSection = statsSection(`Mes badges · ${game.badges.filter(b => b.unlocked).length} / ${BADGES.length}`);
      const grid = el('ul', 'badge-grid');
      game.badges.forEach((b, i) => {
        const item = el('li', b.unlocked ? 'badge' : 'badge is-locked');
        item.append(badgeMedal(b, i), el('span', 'badge-name', b.name), el('span', 'badge-desc', b.desc));
        if (!b.unlocked) {
          item.append(el('span', 'sr-only', 'À débloquer'));
          if (b.goal > 1) {
            const progress = el('span', 'badge-progress');
            const track = el('span', 'progress-track');
            const fill = el('span', 'progress-fill');
            fill.style.width = `${(b.value / b.goal) * 100}%`;
            track.append(fill);
            track.setAttribute('aria-hidden', 'true');
            progress.append(track, el('span', '', `${b.value}/${b.goal}`));
            item.append(progress);
          }
        }
        grid.append(item);
      });
      badgeSection.append(grid);
      body.append(badgeSection);

      // Points faibles
      const weakSection = statsSection('Points faibles');
      const weak = stats.themes
        .filter(t => t.series.length && t.rate !== null && t.rate < WEAK_RATE)
        .sort((a, b) => a.rate - b.rate || a.total - b.total || a.theme.position - b.theme.position)
        .slice(0, 3);
      if (weak.length) {
        const list = el('ul', 'theme-list');
        weak.forEach(t => {
          const item = el('li');
          const card = el('button', 'theme-card is-weak');
          card.type = 'button';
          const num = themeIcon(t.theme);
          const name = el('span');
          name.append(el('span', 'theme-name', t.theme.name), el('span', 'theme-desc', 'Lancer une série ›'));
          const value = el('span', 'weak-rate');
          value.append(el('span', 'sr-only', 'Réussite : '), document.createTextNode(`${t.rate} %`));
          card.append(num, name, value);
          card.addEventListener('click', () => startSeries(t.theme, num));
          item.append(card);
          list.append(item);
        });
        weakSection.append(list);
      } else {
        weakSection.append(el('p', 'stats-note', 'Aucun point faible pour l’instant : tous tes thèmes joués dépassent 70 % de réussite.'));
      }
      body.append(weakSection);

      // Évolution des scores
      const recent = stats.sessions.slice(-SERIES_LENGTH);
      const chartSection = statsSection('Évolution des scores');
      const card = el('div', 'chart-card');
      const caption = el('p', 'chart-caption', recent.length === 1 ? 'Ta dernière série' : `Tes ${recent.length} dernières séries`);
      caption.id = 'chart-caption';
      const chart = el('ol', 'chart');
      chart.setAttribute('aria-labelledby', 'chart-caption');
      recent.forEach(s => {
        const theme = stats.themesById.get(s.theme_id);
        const pct = Math.max(0, Math.min(100, (s.score / s.max_score) * 100));
        const item = el('li', 'chart-item');
        const bar = el('span', 'chart-bar');
        bar.setAttribute('aria-hidden', 'true');
        const fill = el('span', `chart-fill ${rateClass(pct)}`);
        fill.style.height = `${pct}%`;
        fill.style.setProperty('--i', String(chart.children.length));
        bar.append(fill);
        const label = el('span', 'chart-label', themeNum(theme));
        label.setAttribute('aria-hidden', 'true');
        item.append(el('span', 'sr-only', `${shortDate(s.completed_at)}, ${theme.name} : ${s.score} sur ${s.max_score}`), bar, label);
        chart.append(item);
      });
      const from = shortDate(recent[0].completed_at);
      const to = shortDate(recent[recent.length - 1].completed_at);
      card.append(caption, chart, el('p', 'chart-range', from === to ? from : `Du ${from} au ${to}`));
      chartSection.append(card);
      body.append(chartSection);

      // Réussite par thème
      const themeSection = statsSection('Réussite par thème');
      const list = el('ul', 'theme-list');
      stats.themes.forEach(t => {
        const played = t.series.length > 0 && t.rate !== null;
        const item = el('li', played ? 'theme-card is-stat' : 'theme-card is-stat is-unplayed');
        const num = themeIcon(t.theme);
        const content = el('div');
        const row = el('div', 'stat-row');
        const track = el('div', 'progress-track');
        const fill = el('div', played ? `progress-fill ${rateClass(t.rate)}` : 'progress-fill');
        track.append(fill);
        row.append(track);
        let meta;
        if (played) {
          const last = t.series[t.series.length - 1];
          fill.style.width = `${t.rate}%`;
          track.setAttribute('role', 'progressbar');
          track.setAttribute('aria-valuemin', '0');
          track.setAttribute('aria-valuemax', '100');
          track.setAttribute('aria-valuenow', String(t.rate));
          track.setAttribute('aria-label', `Réussite : ${t.theme.name}`);
          const value = el('span', `stat-rate ${rateClass(t.rate)}`, `${t.rate} %`);
          value.setAttribute('aria-hidden', 'true');
          row.append(value);
          meta = `${plural(t.series.length, 'série')} · dernière : ${last.score} / ${last.max_score}`;
        } else {
          track.setAttribute('aria-hidden', 'true');
          meta = 'Pas encore joué';
        }
        content.append(el('span', 'theme-name', t.theme.name), row, el('span', 'theme-desc', meta));
        item.append(num, content);
        list.append(item);
      });
      themeSection.append(list);
      body.append(themeSection);

      show('stats', $('stats-title'));
    }

    // Gamification : XP, rangs, jours d'affilée et badges sont recalculés depuis l'historique des séries,
    // rien de plus n'est stocké.
    const DAILY_GOAL = 2;
    const RANKS = [
      { xp: 0, name: 'Ramasseur de balles' },
      { xp: 300, name: 'Juge de ligne' },
      { xp: 1000, name: 'Arbitre de chaise' },
      { xp: 2500, name: 'Juge-arbitre' },
      { xp: 5000, name: 'Juge-arbitre international' }
    ];
    const BADGES = [
      { id: 'first', name: 'Premier service', desc: 'Terminer une première série', progress: g => [g.series, 1] },
      { id: 'ace', name: 'Ace', desc: 'Faire un sans-faute sur une série', progress: g => [g.perfect, 1] },
      { id: 'run5', name: 'Jeu blanc', desc: '5 bonnes réponses d’affilée', progress: g => [g.bestRun, 5] },
      { id: 'run10', name: 'Jeu décisif', desc: '10 bonnes réponses d’affilée', progress: g => [g.bestRun, 10] },
      { id: 'day5', name: 'Cinq sets', desc: '5 séries dans la même journée', progress: g => [g.maxPerDay, 5] },
      { id: 'days3', name: 'Régularité', desc: 'S’entraîner 3 jours d’affilée', progress: g => [g.bestDays, 3] },
      { id: 'days7', name: 'Semaine de tournoi', desc: 'S’entraîner 7 jours d’affilée', progress: g => [g.bestDays, 7] },
      { id: 'themes8', name: 'Tour du court', desc: 'Jouer 8 thèmes différents', progress: g => [g.themesPlayed, 8] },
      { id: 'slam', name: 'Grand Chelem', desc: 'Jouer tous les thèmes', progress: g => [g.themesPlayed, BANK.themes.length] },
      { id: 'comeback', name: 'Remontada', desc: 'Passer de moins de 50 % à 70 % sur un thème', progress: g => [g.comeback ? 1 : 0, 1] },
      { id: 'vf', name: 'Œil de lynx', desc: '9/10 ou plus au vrai/faux', progress: g => [g.vfBest >= 0.9 ? 1 : 0, 1] },
      { id: 'hundred', name: 'Cent balles', desc: '100 bonnes réponses', progress: g => [g.correct, 100] }
    ];
    const BADGE_ICONS = {
      first: THEME_ICONS['th-04'],
      ace: '<path d="M13 3 5 13.5h6L10 21l8-11h-6z"/>',
      run5: '<path d="M2 12.5l4 4 8-9M10 15.5l1 1 8-9"/>',
      run10: '<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.3 3 2.3 3C11 9 11 6 12 3z"/>',
      day5: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M6.5 9v6M9.5 9v6M12.5 9v6M15.5 9v6M5 15.5 18.5 8.5"/>',
      days3: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14.5h2M12 14.5h2M16 14.5h.01"/>',
      days7: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/>',
      themes8: '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M5 12h14M8 3v18M16 3v18M8 7.5h8M8 16.5h8M12 7.5v9"/>',
      slam: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/>',
      comeback: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
      vf: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
      hundred: '<circle cx="12" cy="12" r="9.5"/><text x="12" y="14.6" text-anchor="middle" font-size="7.5" font-weight="800" fill="currentColor" stroke="none" font-family="system-ui, sans-serif">100</text>'
    };

    function dayNum(date) {
      const d = new Date(date);
      return Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
    }

    function computeGame() {
      const stats = computeStats();
      const { sessions, answers } = stats;
      const g = { series: sessions.length, correct: stats.correct };
      g.perfect = sessions.filter(s => s.score === s.max_score).length;
      g.xp = g.correct * 10 + g.series * 20 + g.perfect * 50;
      g.rank = 0;
      RANKS.forEach((rank, i) => { if (g.xp >= rank.xp) g.rank = i; });

      let run = 0;
      g.bestRun = 0;
      answers.forEach(a => {
        run = a.result === 'correct' ? run + 1 : 0;
        g.bestRun = Math.max(g.bestRun, run);
      });

      const perDay = new Map();
      sessions.forEach(s => {
        const d = dayNum(s.completed_at);
        perDay.set(d, (perDay.get(d) || 0) + 1);
      });
      g.maxPerDay = Math.max(0, ...perDay.values());
      const days = [...perDay.keys()].sort((a, b) => a - b);
      let streak = 0;
      g.bestDays = 0;
      days.forEach((d, i) => {
        streak = i && d === days[i - 1] + 1 ? streak + 1 : 1;
        g.bestDays = Math.max(g.bestDays, streak);
      });
      const today = dayNum(Date.now());
      g.today = perDay.get(today) || 0;
      g.streak = 0;
      for (let d = perDay.has(today) ? today : today - 1; perDay.has(d); d--) g.streak++;

      g.themesPlayed = stats.themes.filter(t => t.series.length).length;
      g.comeback = stats.themes.some(t => {
        let low = false;
        return t.series.some(s => {
          const rate = s.score / s.max_score;
          if (low && rate >= 0.7) return true;
          if (rate < 0.5) low = true;
          return false;
        });
      });
      const vf = stats.themes.find(t => t.theme.id === 'th-vf');
      g.vfBest = vf ? Math.max(0, ...vf.series.map(s => s.score / s.max_score)) : 0;

      g.badges = BADGES.map(b => {
        const [value, goal] = b.progress(g);
        return { ...b, value: Math.min(value, goal), goal, unlocked: value >= goal };
      });
      return g;
    }

    function rankProgress(g) {
      const rank = RANKS[g.rank];
      const next = RANKS[g.rank + 1];
      return next ? ((g.xp - rank.xp) / (next.xp - rank.xp)) * 100 : 100;
    }

    function xpBar(g, label) {
      const track = el('div', 'xp-track');
      track.setAttribute('role', 'progressbar');
      track.setAttribute('aria-label', label);
      track.setAttribute('aria-valuemin', '0');
      track.setAttribute('aria-valuemax', '100');
      track.setAttribute('aria-valuenow', String(Math.round(rankProgress(g))));
      const fill = el('div', 'xp-fill');
      track.append(fill);
      return { track, fill };
    }

    function badgeMedal(badge, i) {
      const medal = el('span', `badge-medal is-${SURFACES[i % SURFACES.length]}`);
      medal.setAttribute('aria-hidden', 'true');
      medal.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${BADGE_ICONS[badge.id]}</svg>`;
      return medal;
    }

    function renderPlayer() {
      const g = computeGame();
      const next = RANKS[g.rank + 1];
      const box = $('player');
      const top = el('div', 'player-top');
      const level = el('span', 'player-level', String(g.rank + 1));
      level.setAttribute('aria-hidden', 'true');
      const who = el('div');
      who.append(el('p', 'player-kicker', `Niveau ${g.rank + 1} · ${g.xp} XP`), el('p', 'player-rank', RANKS[g.rank].name));
      top.append(level, who);
      const { track, fill } = xpBar(g, 'Progression vers le rang suivant');
      fill.style.width = `${rankProgress(g)}%`;
      const hint = el('p', 'player-hint', next ? `Encore ${next.xp - g.xp} XP pour devenir ${next.name}` : 'Rang maximum atteint, bravo !');
      const facts = el('ul', 'player-facts');
      [
        [String(g.streak), g.streak > 1 ? 'jours d’affilée' : 'jour d’affilée'],
        [`${Math.min(g.today, DAILY_GOAL)}/${DAILY_GOAL}`, g.today >= DAILY_GOAL ? 'objectif du jour ✓' : 'séries du jour'],
        [`${g.badges.filter(b => b.unlocked).length}/${BADGES.length}`, 'badges']
      ].forEach(([value, label]) => {
        const item = el('li');
        item.append(el('strong', '', value), el('span', '', label));
        facts.append(item);
      });
      box.replaceChildren(top, track, hint, facts);
    }

    // Gains de la série qui vient de se terminer : XP gagnée, rang, objectif du jour et nouveaux badges
    function renderGains(before) {
      const box = $('gains');
      const after = computeGame();
      const earned = after.xp - before.xp;
      if (earned <= 0) {
        box.hidden = true;
        return;
      }
      const head = el('div', 'gains-head');
      head.append(el('p', 'gains-xp', `+${earned} XP`), el('p', 'gains-rank', `Niveau ${after.rank + 1} · ${RANKS[after.rank].name}`));
      const { track, fill } = xpBar(after, 'Progression vers le rang suivant');
      fill.style.width = `${after.rank > before.rank ? 0 : rankProgress(before)}%`;
      box.replaceChildren(head, track);
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = `${rankProgress(after)}%`; }));

      if (after.rank > before.rank) box.append(el('p', 'gains-note is-up', `Niveau supérieur : tu deviens ${RANKS[after.rank].name} !`));
      if (before.today < DAILY_GOAL && after.today >= DAILY_GOAL) {
        box.append(el('p', 'gains-note', `Objectif du jour atteint : ${DAILY_GOAL} séries !`));
      } else if (after.streak > before.streak && after.streak > 1) {
        box.append(el('p', 'gains-note', `${after.streak} jours d’entraînement d’affilée, continue !`));
      }

      const fresh = after.badges.map((b, i) => [b, i]).filter(([b, i]) => b.unlocked && !before.badges[i].unlocked);
      if (fresh.length) {
        const list = el('ul', 'new-badges');
        fresh.forEach(([b, i], n) => {
          const item = el('li', 'new-badge');
          item.style.setProperty('--i', String(n));
          const text = el('span');
          text.append(el('span', 'new-badge-kicker', 'Nouveau badge'), el('strong', '', b.name), document.createTextNode(b.desc));
          item.append(badgeMedal(b, i), text);
          list.append(item);
        });
        box.append(list);
      }
      box.hidden = false;
    }

    function goHome() {
      series = null;
      renderPlayer();
      show('home', $('home-title'));
    }

    $('next-btn').addEventListener('click', nextQuestion);
    $('replay-btn').addEventListener('click', event => startSeries(series.theme, event.currentTarget));
    $('home-btn').addEventListener('click', goHome);
    $('home-stats-btn').addEventListener('click', renderStats);
    $('score-stats-btn').addEventListener('click', renderStats);
    $('stats-back-btn').addEventListener('click', goHome);
    $('quit-btn').addEventListener('click', () => confirmDialog.showModal());
    $('confirm-stay').addEventListener('click', () => confirmDialog.close());
    $('confirm-quit').addEventListener('click', () => {
      confirmDialog.close();
      goHome();
    });

    $('home-title').tabIndex = -1;
    renderHome();
    renderPlayer();
  </script>
</body>
</html>
